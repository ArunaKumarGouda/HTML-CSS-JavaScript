<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Details</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto; color:#e2e8f0;
background: radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,0.15), transparent 40%), radial-gradient(1000px 500px at 100% 0%, rgba(99,102,241,0.18), transparent 50%), linear-gradient(135deg,#0f172a,#1e293b);} 
.card{width:min(820px,94vw); background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:18px; box-shadow:0 18px 48px rgba(0,0,0,0.45); backdrop-filter:blur(8px); padding:20px;}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.title{font-weight:700;letter-spacing:.3px}
.back{color:#67e8f9;text-decoration:none;font-weight:700}
table{width:100%;border-collapse:separate;border-spacing:0 10px}
th,td{text-align:left;padding:10px 12px}
th{color:#cbd5e1;width:220px}
tr{background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));}
tr td:first-child, tr th:first-child{border-top-left-radius:10px;border-bottom-left-radius:10px}
tr td:last-child, tr th:last-child{border-top-right-radius:10px;border-bottom-right-radius:10px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
button{padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);font-weight:700;cursor:pointer;background:linear-gradient(180deg,#4f46e5,#0ea5e9);color:#fff;box-shadow:0 10px 26px rgba(0,0,0,0.25)}
button.secondary{background:linear-gradient(180deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));color:#e2e8f0}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="title">Review Your Details</div>
    <a href="dashboard.html" class="back">⬅ Dashboard</a>
  </div>
  <table id="reviewTable" aria-label="Review table"></table>
  <div class="actions">
    <button class="secondary" id="editBtn">Edit</button>
    <button id="finalSubmit">Submit</button>
  </div>
</div>
<script>
function esc(s){return String(s==null?'':s)}
var data = {};
try{ data = JSON.parse(localStorage.getItem('biodata')||'{}'); }catch(_e){ data = {}; }

var rows = [
  ['First Name', data.firstName],
  ['Middle Name', data.middleName],
  ['Last Name', data.lastName],
  ["Father's Name", data.fatherName],
  ["Mother's Name", data.motherName],
  ['Email', data.email],
  ['Gender', data.gender],
  ['Languages', Array.isArray(data.languages)?data.languages.join(', '):''],
  ['Date of Birth', data.dob],
  ['Time of Birth', data.tob],
  ['Today Date & Time', data.dt],
  ['Favorite Color', data.color],
  ['Range', data.range]
];

var tbl = document.getElementById('reviewTable');
rows.forEach(function(r){
  var tr = document.createElement('tr');
  var th = document.createElement('th'); th.textContent = r[0];
  var td = document.createElement('td'); td.textContent = esc(r[1]);
  tr.appendChild(th); tr.appendChild(td); tbl.appendChild(tr);
});

document.getElementById('editBtn').addEventListener('click', function(){ window.location.href = 'page4.html'; });
document.getElementById('finalSubmit').addEventListener('click', function(){ window.location.href = 'page4_success.html'; });
</script>
</body>
</html>
