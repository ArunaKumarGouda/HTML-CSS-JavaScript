<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Game Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-start: #0f172a; /* slate-900 */
      --bg-end: #1e293b;   /* slate-800 */
      --surface: rgba(255,255,255,0.06);
      --surface-strong: rgba(255,255,255,0.12);
      --text-primary: #e2e8f0;
      --text-muted: #cbd5e1;
      --ring: rgba(34,211,238,0.35);
      --shadow-1: rgba(0,0,0,0.25);
      --shadow-2: rgba(0,0,0,0.45);
    }

    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,0.15), transparent 40%),
                  radial-gradient(1000px 500px at 100% 0%, rgba(99,102,241,0.18), transparent 50%),
                  linear-gradient(135deg, var(--bg-start), var(--bg-end));
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--text-primary);
    }

    .login-container {
      width: 420px;
      max-width: 92vw;
      background: var(--surface);
      border: 1px solid var(--surface-strong);
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: 0 18px 48px var(--shadow-2);
      backdrop-filter: blur(8px);
    }

    h2 {
      margin: 0 0 6px 0;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      margin: 0 0 18px 0;
      text-align: center;
      color: var(--text-muted);
      font-weight: 600;
    }

    .input-group { margin-bottom: 14px; }
    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    .input-group input {
      width: 100%;
      padding: 12px 1px;
      border-radius: 10px;
      border: 1px solid var(--surface-strong);
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      color: var(--text-primary);
      box-shadow: 0 10px 26px var(--shadow-1);
      font-family: inherit;
    }

    .fields {
      border: 1px solid var(--surface-strong);
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 22px;
      margin-top: 4px;
      border-radius: 10px;
      border: 1px solid var(--surface-strong);
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: #fff;
      background: linear-gradient(180deg, #4f46e5, #0ea5e9);
      box-shadow: 0 10px 26px var(--shadow-1);
      transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 16px 36px var(--shadow-2); filter: brightness(1.05); }
    button:focus-visible, .input-group input:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring); }

    .message {
      margin-top: 12px;
      text-align: center;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--surface-strong);
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
      display: none;
    }
    .message.show { display: block; }
    .message.error { color: #fecaca; border-color: rgba(239,68,68,0.4); }
    .message.success { color: #bbf7d0; border-color: rgba(34,197,94,0.4); }

    .actions { text-align: center; }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Welcome Back</h2>
    <p class="subtitle">Please login to continue</p>

    <div class="fields">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter Username">
      </div>
      
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter Email">
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter Password">
      </div>
    </div>

    <div class="actions">
      <button onclick="login()">Login</button>
    </div>
    <div id="message" class="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
