How does memory get assigned to various function calls during recursion?
In recursion, memory is allocated to function calls on the program's call stack. Each time a function is called, a new stack frame is created and pushed onto the call stack. This stack frame contains information such as function parameters, local variables, return address, and other necessary data for executing the function.

When a function returns, its stack frame is popped off the call stack, releasing the memory allocated to it. This process continues until the initial function call (usually main() in Java) completes, at which point the call stack becomes empty.

Let's break down how memory allocation works during recursion:

Initial Function Call:

When a function is called for the first time, its parameters and local variables are allocated memory within a stack frame.
The return address, which indicates where to return after the function completes, is also stored in the stack frame.
If the function calls itself recursively, a new stack frame is created for each recursive call.
Recursive Calls:

Each recursive call results in the creation of a new stack frame.
The parameters and local variables of each recursive call are stored in their respective stack frames.
As the recursion progresses, the call stack grows deeper, with each function call adding a new stack frame on top of the previous one.
Base Case and Returning:

When the base case (i.e., the termination condition of the recursion) is reached, the function begins to return.
As each function returns, its stack frame is popped off the call stack, freeing up the memory allocated to it.
The return value of each function call is typically used in the calculation of the previous function call's result, until the initial function call returns the final result.
Stack Overflow:

If the depth of recursion becomes too large, the call stack may run out of memory, leading to a stack overflow error.
This typically happens when there are too many nested function calls and the call stack exceeds its maximum size.
Example: FactorialExample.java

public class FactorialExample {  
    public static int factorial(int n) {  
        // Base case  
        if (n == 0 || n == 1)  
            return 1;  
        // Recursive case  
        else  
            return n * factorial(n - 1);  
    }  
    public static void main(String[] args) {  
        int result = factorial(5);  
        System.out.println("Factorial of 5 is: " + result);  
    }  
}

Factorial of 5 is: 120
Explanation:

In this example, when factorial(5) is called:

Initial Call (factorial(5)):

A stack frame is created for the initial call to factorial(5).
Inside this stack frame, the value of n is set to 5, and other necessary information, such as the return address, is stored.
First Recursive Call (factorial(4)):

Upon encountering the recursive call factorial(n - 1), a new stack frame is created for factorial(4).
This stack frame contains its own copy of the parameter n, which is set to 4.
The call stack now contains two stack frames: one for factorial(5) and one for factorial(4).
Subsequent Recursive Calls:

The process repeats as more recursive calls are made, each resulting in the creation of a new stack frame with its own copy of the parameter n.
Each stack frame remains on the call stack until its corresponding function call completes.
Base Case and Returning:

Eventually, the base case (n == 0 or n == 1) is reached, and the recursion starts to unwind.
As each function call returns, its stack frame is removed from the call stack, freeing up memory.
The return values of the recursive calls are used to calculate the final result.
Final Result:

After all recursive calls have returned, the initial call to factorial(5) obtains the final result.
Once the main function completes, the call stack becomes empty, and all memory allocated to the function calls is released.
Advantages of Recursive Programming
Simplicity and Clarity: Recursive solutions are often more concise and easier to understand compared to iterative solutions. They reflect the natural structure of the problem, making the code intuitive and readable.

Divide and Conquer: Recursive algorithms follow the divide-and-conquer paradigm, breaking down complex problems into smaller, more manageable sub-problems. This simplifies problem-solving and leads to elegant solutions.

Modularity: Recursive functions encapsulate repetitive patterns, promoting code reusability. Once a recursive function is implemented, it can be easily reused for similar problems without modification.

Reduced Code Complexity: Recursive solutions can reduce code complexity by abstracting away repetitive details. They often result in fewer lines of code compared to equivalent iterative solutions, leading to cleaner and more maintainable codebases.

Support for Data Structures: Recursion is well-suited for solving problems involving tree-like data structures such as binary trees, graphs, and linked lists. It simplifies operations like traversal, search, and manipulation of these data structures.

Mathematical Problems: Recursive programming is particularly effective for solving mathematical problems that exhibit recursive patterns, such as factorial calculation, Fibonacci sequence generation, and exponentiation.

Parallelism and Concurrency: Recursive algorithms can be parallelized to take advantage of multi-core processors and distributed computing environments. Each recursive branch can be executed concurrently, improving performance in certain scenarios.

Disadvantages of Recursive Programming
Performance Overhead: Recursive solutions often incur performance overhead due to the additional function call stack management. Each recursive call requires memory allocation for parameters, local variables, and return addresses, which can lead to increased memory usage and slower execution compared to iterative solutions.

Stack Overflow: Excessive recursion can lead to stack overflow errors, especially if the depth of recursion becomes too large. This occurs when the call stack runs out of memory due to a large number of nested function calls, causing the program to terminate unexpectedly.

Difficulty in Debugging: Recursive solutions can be more challenging to debug compared to iterative solutions. Tracing through multiple recursive calls to identify logical errors or unexpected behavior may require additional effort and debugging tools.

Potential for Infinite Recursion: If a recursive function lacks proper termination conditions or if the termination conditions are not correctly implemented, it may result in infinite recursion. Infinite recursion causes the program to enter an endless loop, consuming CPU resources and potentially crashing the program.

Limited Readability for Some Developers: While recursive solutions can be concise and elegant, they may not be immediately understandable to all developers, especially those who are not familiar with recursive programming concepts. Understanding the flow of execution and reasoning about recursive algorithms may require additional effort for some programmers.

Difficulty in Optimization: Recursive algorithms can be challenging to optimize compared to iterative algorithms. Tail recursion optimization and memoization techniques may help improve performance, but optimizing recursive solutions often requires a deep understanding of the problem domain and the underlying recursive patterns.

Potential for Poor Scalability: Recursive algorithms may not scale well for very large input sizes or deeply nested data structures. The overhead associated with recursive function calls and memory allocation may become prohibitive for extremely large problem instances, leading to degraded performance or resource exhaustion.`;

Call by Value in Java
In Java, when a method is called by passing a value as an argument, it is referred to as call by value. With Java's call-by-value feature, a copy of the variable is passed to the method. As a result, any modifications made within the method only affect that method and do not impact the original variable in the main method.

This is the primary distinction between Java's call-by-reference and call-by-value functions. Passing a variable with basic data types is considered a call by value; therefore, any modifications made to the variable will not be reflected in the caller's scope.

Important Points to Remember
Java always uses call by value, even for objects.
When a primitive type (like int, double, float) is passed to a method, a copy of the value is made.
Changes inside the method do not affect the original variable

Call by Reference (Object Reference) in Java
In Java, Call by Reference means passing a reference (memory address) of the object by value to a method. Even though Java strictly uses call by value, it duplicates the reference before passing it as a value to the method when we send the reference of an object. The most important difference between call by value and call by reference in Java is that the copied reference also points to the same address, ensuring that all modifications are reflected in the main method.

Important Points to Remember
Java does not support true call by reference; it passes the reference by value.
When an object is passed, a copy of the reference is made.
The reference still points to the same object, so modifications inside the method affect the original object.

Java Wrapper classes offer several advantages over primitive data types. It includes encapsulation, type conversion, autoboxing and unboxing, and utility methods. Wrapper classes are also thread-safe and immutable, making them ideal for multi-threaded applications. Some advantages of wrapper class are:

In Java, abstraction is the process of hiding the implementation details and only exposing the features or capabilities that are necessary to the user. It emphasizes what an object does rather than how it does it.

Features of Abstraction
Abstraction highlights only the essential features while hiding the complex details.
Abstract classes can contain methods without implementation and should be implemented by subclasses.
Due to the principles of abstraction, code that depends on it remains unaffected.
Changes in implementation do not affect the external usage of the class.
It restricts direct access to implementation details, ensuring enhanced security and modularity.
It promotes loose coupling by minimising dependencies between components, thereby making the system more scalable.
It avoids code duplication.
Real World Example of Abstraction
ATM Machine: When we use an ATM, we interact with a simple interface-enter your PIN, select an option, and withdraw cash. But we do not see the complex backend processes like authentication, transaction validation, and communication with the bank servers. The internal workings are completely hidden from the user.

Car Driving: When we drive a car, we use the steering, accelerator, and brakes without knowing the intricate details of how the engine, transmission, and braking system work internally. The car abstracts away the complexity, allowing us to focus on driving.

Achieving Abstraction
In Java, abstraction can be achieved in the following two ways:

Using Abstract Class (For Partial Abstraction)
Using Interface (For 100% abstraction)
1) Using Abstract Class
An abstract class is a class that cannot be instantiated directly. It serves as a blueprint for other classes. We define an abstract class using the abstract keyword.

Important Points to Remember
An abstract class is a class declared with the abstract keyword.
An abstract method is a method declared without any implementation.
An abstract class can contain both abstract and concrete methods (where implementation is present).
A child class whose parent is an abstract class must implement the abstract method. If the child class cannot provide the implementation, then it must be declared as abstract.
Any class that contains one or more abstract methods must be declared as abstract.
Instantiation of an abstract class is not allowed in Java. In other words, one cannot create an object of an abstract class using the new keyword.
If no constructor is provided, an abstract class has a default constructor. An abstract class can also include user-defined constructors.
Creating more than one constructor is permitted in an abstract class.

    abstract void makeSound(); // Abstract method (no implementation)  
    void eat() { // Concrete method  
        System.out.println("I can eat.");

When to Use Abstract Class?
We should use abstract classes and abstract methods to define a common blueprint for multiple related classes while implementing specific functionalities.

We should use abstract classes in the following cases.

If multiple related classes share common functionality, an abstract class can provide default implementations.
When we want to provide some implemented methods while leaving other methods for implementation in subclasses.
If the program design follows an inheritance-based design and has IS-A For example, Parent is a superclass for Father and Son.
It helps to avoid code duplication by centralizing shared logic.
We should use abstract methods in the following cases.

If all subclasses require a specific functionality, define it as an abstract method.
Abstract methods ensure that their implementation will be provided in subclasses.
Enables various subclasses to implement the method uniquely while preserving consistency.
2) Using Interface
In Java, another way to implement abstraction is by using interfaces. Interfaces are useful for achieving 100% abstraction. In Java, as well as in other languages, interfaces include both variables and methods, but do not provide a method body.

Advantages of Abstraction
By hiding the implementation details, abstraction makes complex systems easier to comprehend.
Abstraction maintains various components of the system separated.
Maintenance of code is done more efficiently using abstraction.
Abstraction enhances security by only displaying the details that are necessary to the user.
Disadvantages of Abstraction
If overused, abstraction can add unnecessary complexity.
Flexibility in implementation may be reduced using abstraction.
Abstraction can make understanding the system and debugging harder for unfamiliar users.
Performance can be affected by the layers of abstraction.
Common Mistakes to Avoid
The following is a list of common errors that can occur while working with abstraction, which should be avoided:

Ensure that in the concrete subclass, abstract methods are implemented.
Avoid making everything abstract when it is not required. Use abstraction only when it enhances the design.
When abstract methods are overridden, ensure the method signature matches exactly; otherwise, it can cause errors.
Best Practices
Use abstract classes when a common base class with shared functionality is needed.
Use interfaces when complete abstraction or multiple inheritance is required.
Keep interfaces small and focused; never include unrelated methods in a single interface.

The String class is one of the most fundamental types in Java, designed to represent immutable sequences of characters. Here's a closer look at its characteristics and the interfaces it implements:

Memory Allotment of String
Memory allotment for strings in Java is interesting due to Java's handling of string immutability and the string pool mechanism. Understanding how strings are stored can help optimize memory usage in Java applications, especially those that heavily use string manipulations.

String Literal Storage: When you create a string using string literals, Java checks the string pool first. The new variable points to the existing string if it already exists. If it doesn't exist, the new string is added to the Pool, and the variable points to this new string.

Syntax:

String s1 = "Hello"; // String literal  
String s2 = "Hello"; // Points to the same "Hello" in the Pool as s1  
new Keyword and String Pool: Strings created with the new operator do not use the Pool by default. They are stored in the heap memory outside the Pool, which means each new operation results in a new object, even if it contains the same string data.

Syntax:

String s3 = new String("Hello"); // A new string object is created in the heap  
Interning: We can manually add a string to the Pool or ensure it uses the Pool by calling the intern() method on a string object. If the Pool already contains an equal string, the string from the Pool is returned. Otherwise, the string is added to the Pool.

Syntax:

String s4 = new String("Hello").intern(); // Ensures use of the string pool  
Filename: StringMemoryAllotment.java

public class StringMemoryAllotment {  
    public static void main(String[] args) {  
        // String literals - stored in the string pool  
        String str1 = "Java";  
        String str2 = "Java";  
        // Checking if str1 and str2 point to the same object  
        System.out.println("str1 == str2: " + (str1 == str2)); // true, because both refer to the same string literal in the pool  
        // Strings created with 'new' - stored in heap memory outside the string pool  
        String str3 = new String("Java");  
        String str4 = new String("Java");  
        // Checking if str3 and str4 point to the same object  
        System.out.println("str3 == str4: " + (str3 == str4)); // false, because 'new' creates a new object each time  
        // Interning str3  
        String str5 = str3.intern();  
        // Checking if str1 and str5 point to the same object  
        System.out.println("str1 == str5: " + (str1 == str5)); // true, str5 is interned, so it refers to the string in the pool  
        // Demonstrating the effect of interning on memory allocation  
        String str6 = new String("Java").intern();  
        // Checking if str6 is the same as str1  
        System.out.println("str1 == str6: " + (str1 == str6)); // true, str6 is interned and points to the pooled instance  
    }  
}

str3 == str4: false
str1 == str5: true

In this section, we will learn about Java exceptions, it's types, and the difference between checked and unchecked exceptions.

What is Exception in Java?
In Java, an exception is an event that occurs during the execution of a program that disrupts the normal flow of instructions. These exceptions can occur for various reasons, such as invalid user input, file not found, or division by zero. When an exception occurs, it is typically represented by an object of a subclass of the java.lang.Exception class.

What is Exception Handling?
Exception Handling is a mechanism to handle runtime errors such as ClassNotFoundException, IOException, SQLException, RemoteException, etc.

Advantage of Exception Handling
The core advantage of exception handling is to maintain the normal flow of the application. An exception normally disrupts the normal flow of the application; that is why we need to handle exceptions. Let's consider a scenario:

statement 1;  
statement 2;  
statement 3;  
statement 4;  
statement 5;//exception occurs  
statement 6;  
statement 7;  
statement 8;  
statement 9;  
statement 10;  
Suppose there are 10 statements in a Java program and an exception occurs at statement 5; the rest of the code will not be executed, i.e., statements 6 to 10 will not be executed. However, when we perform exception handling, the rest of the statements will be executed. That is why we use exception handling in Java.

Hierarchy of Java Exception classes
The java.lang.Throwable class is the root class of Java Exception hierarchy inherited by two subclasses: Exception and Error. The hierarchy of Java Exception classes is given below:

hierarchy of exception handling
Types of Java Exceptions
In Java, exceptions are categorized into two main types: checked exceptions and unchecked exceptions. Additionally, there is a third category known as errors. Let's delve into each of these types:

Checked Exception
Unchecked Exception
Error
hierarchy of exception handling
1. Checked Exceptions
Checked exceptions are the exceptions that are checked at compile-time. This means that the compiler verifies that the code handles these exceptions either by catching them or declaring them in the method signature using the throws keyword. Examples of checked exceptions include:

IOException: An exception is thrown when an input/output operation fails, such as when reading from or writing to a file.

SQLException: It is thrown when an error occurs while accessing a database.

ParseException: Indicates a problem while parsing a string into another data type, such as parsing a date.

ClassNotFoundException: It is thrown when an application tries to load a class through its string name using methods like Class.forName(), but the class with the specified name cannot be found in the classpath.

2. Unchecked Exceptions (Runtime Exceptions)
Unchecked exceptions, also known as runtime exceptions, are not checked at compile-time. These exceptions usually occur due to programming errors, such as logic errors or incorrect assumptions in the code. They do not need to be declared in the method signature using the throws keyword, making it optional to handle them. Examples of unchecked exceptions include:

NullPointerException: It is thrown when trying to access or call a method on an object reference that is null.

ArrayIndexOutOfBoundsException: It occurs when we try to access an array element with an invalid index.

ArithmeticException: It is thrown when an arithmetic operation fails, such as division by zero.

IllegalArgumentException: It indicates that a method has been passed an illegal or inappropriate argument.

3. Errors
Errors represent exceptional conditions that are not expected to be caught under normal circumstances. They are typically caused by issues outside the control of the application, such as system failures or resource exhaustion. Errors are not meant to be caught or handled by application code. Examples of errors include:

OutOfMemoryError: It occurs when the Java Virtual Machine (JVM) cannot allocate enough memory for the application.

StackOverflowError: It is thrown when the stack memory is exhausted due to excessive recursion.

NoClassDefFoundError: It indicates that the JVM cannot find the definition of a class that was available at compile-time.

Understanding the different types of exceptions in Java is crucial for writing robust and reliable code. By handling exceptions appropriately, you can improve the resilience of your applications and provide better user experiences.hierarchy of exception handling

Java Exception Keywords
Java provides five keywords that are used to handle the exception. The following table describes each.

Keyword
Description
try
The "try" keyword is used to specify a block where we should place an exception code. It means we can't use try block alone. The try block must be followed by either catch or finally.
catch
The "catch" block is used to handle the exception. It must be preceded by try block which means we can't use catch block alone. It can be followed by finally block later.
finally
The "finally" block is used to execute the necessary code of the program. It is executed whether an exception is handled or not.
throw
The "throw" keyword is used to throw an exception.
throws
The "throws" keyword is used to declare exceptions. It specifies that there may occur an exception in the method. It doesn't throw an exception. It is always used with method signature.

The try-catch Block
One of the primary mechanisms for handling exceptions in Java is the try-catch block. The try block contains the code that may throw an exception, and the catch block is used to handle the exception if it occurs. Here's a basic example:

try {  
    // Code that may throw an exception  
} catch (ExceptionType e) {  
    // Exception handling code  
}  
Handling Multiple Exceptions
You can handle multiple types of exceptions by providing multiple catch blocks, each catching a different type of exception. This allows you to tailor your exception handling logic based on the specific type of exception thrown. Here's an example:

try {  
    // Code that may throw an exception  
} catch (IOException e) {  
    // Handle IOException  
} catch (NumberFormatException e) {  
    // Handle NumberFormatException  
} catch (Exception e) {  
    // Handle any other exceptions  
}  
The finally Block
In addition to try and catch, Java also provides a finally block, which allows you to execute cleanup code, such as closing resources, regardless of whether an exception occurs or not. The finally block is typically used to release resources that were acquired in the try block. Here's an example:

try {  
    // Code that may throw an exception  
} catch (Exception e) {  
    // Exception handling code  
} finally {  
    // Cleanup code  
}

Java finally Block FAQs
1. What is the purpose of the finally block?

The finally block is used to execute cleanup code, such as closing file streams or releasing resources, ensuring it runs even if an exception is thrown.

2. Does the finally block always execute?

Yes, the finally block executes regardless of whether an exception occurs, unless the JVM exits due to a call to System.exit() or a fatal error.

3. Can a finally block contain a return statement?

Yes, but using a return statement inside the finally block can override any return statements in the try or catch blocks, which may lead to unexpected behavior.

4. Is it mandatory to use a finally block?

No, but it is recommended when resource cleanup is necessary. You can use try-catch without finally, but finally ensures that the cleanup code runs.

5. What happens if an exception occurs inside the finally block?

If an exception occurs in the finally block, it can overshadow exceptions from the try or catch block, potentially concealing the original exception.`;

When to use the throws keyword?
The throws keyword should be used when a method might result in a checked exception but is not responsible for handling it directly. It is appropriate when you want to inform the caller about potential exceptions, allowing them to decide how to handle them.

Methods that deal with file handling, database connections, or network operations often declare exceptions using throws. This approach maintains cleaner code by pushing the responsibility of handling the exception to higher levels in the program's call stack.

Common Mistakes While Using Throws
A common mistake is using throws for unchecked exceptions NullPointerException, which do not require a declaration. Another error is assuming that declaring an exception with throws means it is handled-it only notifies the caller. Also, overusing throws can lead to poor exception management, making the code harder to maintain. Developers must ensure that exceptions are properly caught at an appropriate level to prevent unexpected crashes.

Important Points to Remember
Notice that the throws keyword is used to define exceptions in the header of a method in question, which notifies the caller of some exceptions that can be thrown.
It is only appropriate to use throws with checked exceptions, such as IOException or SQLException, and not with unchecked exceptions like NullPointerException or ArithmeticException.
A method that calls another method that declares a checked exception should either try to handle it within a try-catch block or re-declare it with a throws clause.
Using throws to define an exception does not mean that the exception is being handled. It is just being handed over to the parent level.
An exception that goes uncaught will be thrown at runtime, causing an unexpected and uncontrolled crash of the application.
Classes of Error, like OutOfMemoryError and StackOverflowError, do not need to be caught with defined throws because such errors are not meant to be controlled by the program.
Conclusion
The throws feature in the Java programming language is very important in the context of exception handling, specifically checked exceptions. It enables the code to pass the burden of dealing with exceptions upwards, to the calling method. This enhances the organization of the code as well as modularity. Proper handling of exceptions improves the program's robustness and ease of debugging since the error's location and its type are clearly marked.`;

class MyThread extends Thread {    
    private String threadName;    
    MyThread(String name) {    
        threadName = name;    
    }    
    // Override the run method to define the task for the thread    
    public void run() {    
        for (int i = 1; i <= 5; i++) {    
            System.out.println(threadName + " - Count: " + i);    
            try {    
                // Sleep for a while to simulate some work    
                Thread.sleep(1000);    
            } catch (InterruptedException e) {    
                System.out.println(threadName + " interrupted.");    
            }    
        }    
        System.out.println(threadName + " finished.");    
    }    
}    
public class Main {    
    public static void main(String[] args) {    
        // Create instances of MyThread    
        MyThread thread1 = new MyThread("Thread 1");    
        MyThread thread2 = new MyThread("Thread 2");    
        MyThread thread3 = new MyThread("Thread 3");    
        // Start the threads    
        thread1.start();    
        thread2.start();    
        thread3.start();    
        // Wait for all threads to finish    
        try {    
            thread1.join();    
            thread2.join();    
            thread3.join();    
        } catch (InterruptedException e) {    
            System.out.println("Main thread interrupted.");    
        }    
        System.out.println("All threads have finished.");    
    }    
}

In Java, threads go through several distinct states during their lifetime, as defined in java.lang.Thread.State class. All thread states are Enum constants. A thread can be in only one state at a given point in time.

These states are virtual machine states which do not reflect any operating system thread states. A thread can be in one of the following states:

Thread States
Description
NEW
A thread that has not yet started is in this state.
RUNNABLE
A thread executing in the Java virtual machine is in this state.
BLOCKED
A thread that is blocked waiting for a monitor lock is in this state.
WAITING
A thread that is waiting indefinitely for another thread to perform a particular action is in this state.
TIMED_WAITING
A thread that is waiting for another thread to perform an action for up to a specified waiting time is in this state.
TERMINATED
A thread that has exited is in this state.
Thread States
NEW: A thread is in the NEW state when an instance of Thread is created but the start() method has not yet been invoked. At this stage, the thread is not yet "alive" and is not eligible to be run by the thread scheduler.

public static final Thread.State NEW  
RUNNABLE: A thread, that is ready to run and invokes the start() method, it moves from the NEW state to RUNNABLE state. In the runnable state, the thread may be running or may be ready to run at any given instant of time. It is the duty of the thread scheduler to provide the thread time to run.

public static final Thread.State RUNNABLE  
A program implementing multithreading acquires a fixed slice of time to each individual thread. Each and every thread runs for a short span of time and when that allocated time slice is over, the thread voluntarily gives up the CPU to the other thread, so that the other threads can also run for their slice of time. Whenever such a scenario occurs, all those threads that are willing to run, waiting for their turn to run, lie in the RUNNABLE state. In the RUNNABLE state, there is a queue where the threads lie.

When the thread gets the CPU, it moves from the RUNNABLE state to the running state. Generally, the most common change in the state of a thread is from RUNNABLE to running and again back to RUNNABLE.

BLOCKED: A thread enters the BLOCKED state when it is waiting to acquire a monitor lock that is held by another thread. This typically occurs when a thread attempts to enter a synchronized block or method and the lock is unavailable.

public static final Thread.State BLOCKED  
For example, a thread (let's say A) may want to print some data from the printer. However, at the same time, the other thread (let's say B) is using the printer to print some data. Therefore, thread A has to wait for thread B to use the printer. Thus, thread A is in the BLOCKED state. A thread in the BLOCKED state is unable to perform any execution and thus never consume any cycle of the Central Processing Unit (CPU). Hence, we can say that thread A remains idle until the thread scheduler reactivates thread A, which is in the waiting or BLOCKED state.

When the main thread invokes the join() method then, it is said that the main thread is in the WAITING state. The main thread then waits for the child threads to complete their tasks. When the child threads complete their job, a notification is sent to the main thread, which again moves the thread from WAITING to the RUNNABLE state.

If there are a lot of threads in the waiting or blocked state, then it is the duty of the thread scheduler to determine which thread to choose and which one to reject, and the chosen thread is then given the opportunity to run.

WAITING: A thread transitions to the Waiting state when it is waiting indefinitely for another thread to perform a specific action. It can happen when methods like Object.wait() (without a timeout) or Thread.join() (without a timeout) are called. The thread will remain in this state until it is notified by another thread (for example, via Object.notify() or Object.notifyAll()) or the joined thread completes.

public static final Thread.State WAITING  
The key difference between WAITING and TIMED_WAITING is the time constraint. Waiting has no time constraint, whereas timed waiting has the time constraint. A thread invoking the following method reaches the timed waiting state.

sleep
join with timeout
wait with timeout
parkUntil
parkNanos
It represents the final state of a thread that is terminated or dead. A terminated thread means it has completed its execution.

TIMED_WAITING: Sometimes, waiting for leads to starvation. For example, a thread (its name is A) has entered the critical section of a code and is not willing to leave that critical section. In such a scenario, another thread (its name is B) has to wait forever, which leads to starvation. To avoid such scenario, a timed WAITING state is given to thread B. Thus, thread lies in the WAITING state for a specific span of time, and not forever. A real example of timed waiting is when we invoke the sleep() method on a specific thread. The sleep() method puts the thread in the TIMED WAIT state. After the time runs out, the thread wakes up and start its execution from when it has left earlier.

public static final Thread.State TIMED_WAITING  
TERMINATED: A thread reaches the TERMINATED state because of the following reasons:

When a thread has finished its job, then it exists or terminates normally.
Abnormal termination:It occurs when some unusual events such as an unhandled exception or segmentation fault.
A terminated thread means the thread is no more in the system. In other words, the thread is dead, and there is no way one can respawn (active after kill) the dead thread.

public static final Thread.State TERMINATED

any state → finished/error → terminated

Multithreading is a fundamental concept in Java programming, allowing developers to execute multiple tasks concurrently within a single program. Threads are lightweight processes that run within the context of a larger process, enabling efficient utilization of system resources and enhancing application responsiveness. In this section, we will explore how to create threads in Java, covering various approaches, best practices.

In Java, threads are represented by instances of the Thread class or by implementing the Runnable interface. The Thread class provides built-in support for multithreading, while the Runnable interface defines a single method, run() that contains the code to be executed by the thread. By implementing the Runnable interface, we can decouple the task from the thread itself, promoting better code organization and reusability.

There are the following two ways to create a thread:

By Extending Thread Class
By Implementing Runnable Interface
Thread Class
The simplest way to create a thread in Java is by extending the Thread class and overriding its run() method. Thread class provide constructors and methods to create and perform operations on a thread. Thread class extends Object class and implements Runnable interface.

Thread Class Methods
public void run(): is used to perform action for a thread.
public void start(): starts the execution of the thread.JVM calls the run() method on the thread.
public void sleep(long miliseconds): Causes the currently executing thread to sleep (temporarily cease execution) for the specified number of milliseconds.
public void join(): waits for a thread to die.
public void join(long miliseconds): waits for a thread to die for the specified miliseconds.
public int getPriority(): returns the priority of the thread.
public int setPriority(int priority): changes the priority of the thread.
public String getName(): returns the name of the thread.
public void setName(String name): changes the name of the thread.
public Thread currentThread(): returns the reference of currently executing thread.
public int getId(): returns the id of the thread.
public Thread.State getState(): returns the state of the thread.
public boolean isAlive(): tests if the thread is alive.
public void yield(): causes the currently executing thread object to temporarily pause and allow other threads to execute.
public void suspend(): is used to suspend the thread(depricated).
public void resume(): is used to resume the suspended thread(depricated).
public void stop(): is used to stop the thread(depricated).
public boolean isDaemon(): tests if the thread is a daemon thread.

public void interrupt(): interrupts the thread.
public boolean isInterrupted(): tests if the thread has been interrupted.
public static boolean interrupted(): tests if the current thread has been interrupted.
By Implementing Runnable Interface
Another approach to creating threads in Java is by implementing the Runnable interface. The Runnable interface should be implemented by any class whose instances are intended to be executed by a thread. Runnable interface have only one method named run(). This approach is preferred when we want to separate the task from the thread itself, promoting better encapsulation and flexibility.

public void run(): is used to perform action for a thread.

Starting a Thread
The start() method of the Thread class is used to start a newly created thread. It performs the following tasks:

A new thread starts (with new callstack).
The thread moves from New state to the Runnable state.
When the thread gets a chance to execute, its target run() method will run.

  </script>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title"><i class="fa-solid fa-robot"></i> AI Assistant</div>
      <div class="controls">
        <button class="btn" id="settingsBtn"><i class="fa-solid fa-gear"></i> Settings</button>
        <a class="btn" href="dashboard.html"><i class="fa-solid fa-grid-2"></i> Dashboard</a>
      </div>
    </div>
    <div class="kpis">
      <div class="badge">Mode: <span id="modeLabel">Smart (offline)</span></div>
      <div class="badge">Privacy: On-device by default</div>
    </div>
    <div class="messages"></div>
    <div class="inputbar">
      <textarea id="prompt" class="text" rows="2" placeholder="Type your question... Press Enter to send"></textarea>
      <button class="btn" id="send"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
    <div class="settings">
      <div class="row" style="margin-bottom:10px">
        <label class="toggle"><input type="checkbox" id="useCloud"> Enable Cloud AI</label>
        <select id="model">
          <option value="gpt-4o-mini">gpt-4o-mini</option>
          <option value="gpt-4o">gpt-4o</option>
          <option value="gpt-4o-mini-transcribe">gpt-4o-mini-transcribe</option>
        </select>
        <input id="apiKey" type="password" placeholder="Enter OpenAI API Key" style="min-width:260px">
      </div>
      <div class="row" style="color:var(--text-muted); font-size:12px">Your key is used only in your browser. If disabled, the assistant works fully offline with a smart heuristic.
      </div>
    </div>
  </div>
</body>
</html>
