  <script>
    // Simple utility helpers
    const qs = (sel, el=document) => el.querySelector(sel);
    const ce = (tag, cls) => { const n = document.createElement(tag); if (cls) n.className = cls; return n; };

    let cloudEnabled = false; // toggled by user
    let apiKey = '';
    let model = 'gpt-4o-mini';

    const messages = [];

    function addMessage(role, text) {
      messages.push({ role, content: text, ts: new Date() });
      renderMessages();
    }

    function renderMessages() {
      const wrap = qs('.messages');
      wrap.innerHTML = '';
      messages.forEach(m => {
        const b = ce('div', `bubble ${m.role}`);
        
        // Check if content contains URLs
        const text = m.content;
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        const urls = text.match(urlRegex);
        
        if (urls && urls.length > 0) {
          // Split text by URLs and process each part
          let lastIndex = 0;
          urls.forEach(url => {
            const urlIndex = text.indexOf(url, lastIndex);
            
            // Add text before URL
            if (urlIndex > lastIndex) {
              const textNode = ce('span');
              textNode.textContent = text.substring(lastIndex, urlIndex);
              b.appendChild(textNode);
            }
            
            // Process URL
            const urlText = url.trim();
            if (isValidUrl(urlText)) {
              // Check what type of media it is
              if (isImageUrl(urlText)) {
                const imgContainer = ce('div');
                imgContainer.appendChild(createMediaElement(urlText, 'image'));
                b.appendChild(imgContainer);
              } else if (isYouTubeUrl(urlText)) {
                const embedUrl = getYouTubeEmbedUrl(urlText);
                if (embedUrl) {
                  b.appendChild(createMediaElement(embedUrl, 'youtube'));
                } else {
                  const link = ce('a');
                  link.href = urlText;
                  link.textContent = urlText;
                  link.target = '_blank';
                  link.style.color = 'var(--accent-1)';
                  b.appendChild(link);
                }
              } else if (isVimeoUrl(urlText)) {
                const embedUrl = getVimeoEmbedUrl(urlText);
                if (embedUrl) {
                  b.appendChild(createMediaElement(embedUrl, 'vimeo'));
                } else {
                  const link = ce('a');
                  link.href = urlText;
                  link.textContent = urlText;
                  link.target = '_blank';
                  link.style.color = 'var(--accent-1)';
                  b.appendChild(link);
                }
              } else if (isVideoUrl(urlText)) {
                b.appendChild(createMediaElement(urlText, 'video'));
              } else {
                // Regular link
                const link = ce('a');
                link.href = urlText;
                link.textContent = urlText;
                link.target = '_blank';
                link.style.color = 'var(--accent-1)';
                link.style.wordBreak = 'break-all';
                b.appendChild(link);
              }
            } else {
              // Invalid URL, just show as text
              const textNode = ce('span');
              textNode.textContent = urlText;
              b.appendChild(textNode);
            }
            
            lastIndex = urlIndex + url.length;
          });
          
          // Add remaining text after last URL
          if (lastIndex < text.length) {
            const textNode = ce('span');
            textNode.textContent = text.substring(lastIndex);
            b.appendChild(textNode);
          }
        } else {
          // No URLs, just display text normally
          b.innerText = text;
        }
        
        const meta = ce('div', 'meta');
        meta.innerText = `${m.role === 'user' ? 'You' : 'Assistant'} • ${m.ts.toLocaleTimeString()}`;
        b.appendChild(meta);
        wrap.appendChild(b);
      });
      wrap.scrollTop = wrap.scrollHeight;
    }

    function showTyping() {
      const wrap = qs('.messages');
      const b = ce('div', 'bubble assistant');
      const span = ce('span', 'typing');
      span.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
      b.appendChild(span);
      wrap.appendChild(b); wrap.scrollTop = wrap.scrollHeight;
      return b; // return node to replace later
    }

    function typeInto(node, fullText, done) {
      node.innerHTML = '';
      let i = 0;
      const tick = () => {
        node.textContent = fullText.slice(0, i++);
        if (i <= fullText.length) {
          node.scrollIntoView({ behavior:'smooth', block:'end' });
          setTimeout(tick, 1);
        } else { done && done(); }
      };
      tick();
    }

    function sanitizeMath(expr) {
      // allow digits, operators, parentheses, decimals and spaces only
      if (!/^[0-9+\-*/()%.^\s]+$/.test(expr)) return null;
      return expr.replace(/\^/g, '**');
    }

    // URL detection and media handling
    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === 'http:' || url.protocol === 'https:';
      } catch (_) {
        return false;
      }
    }

    function isImageUrl(url) {
      const imageExtensions = /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)(\?.*)?$/i;
      return imageExtensions.test(url) || /\.(jpg|jpeg|png|gif|webp|svg|bmp|ico)/i.test(url);
    }

    function isVideoUrl(url) {
      const videoExtensions = /\.(mp4|webm|ogg|mov|avi|wmv|flv|mkv)(\?.*)?$/i;
      return videoExtensions.test(url) || /\.(mp4|webm|ogg|mov|avi|wmv|flv|mkv)/i.test(url);
    }

    function getYouTubeEmbedUrl(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
      const match = url.match(regExp);
      if (match && match[2].length === 11) {
        return 'https://www.youtube.com/embed/' + match[2];
      }
      return null;
    }

    function isYouTubeUrl(url) {
      return /youtube\.com|youtu\.be/i.test(url);
    }

    function isVimeoUrl(url) {
      return /vimeo\.com/i.test(url);
    }

    function getVimeoEmbedUrl(url) {
      const regExp = /vimeo\.com\/(\d+)/;
      const match = url.match(regExp);
      if (match) {
        return 'https://player.vimeo.com/video/' + match[1];
      }
      return null;
    }

    function createMediaElement(url, type) {
      if (type === 'image') {
        const img = ce('img');
        img.src = url;
        img.style.maxWidth = '100%';
        img.style.borderRadius = '8px';
        img.style.marginTop = '8px';
        img.style.display = 'block';
        img.onerror = function() {
          this.style.display = 'none';
          const errorMsg = ce('div');
          errorMsg.textContent = 'Failed to load image';
          errorMsg.style.color = 'var(--text-muted)';
          errorMsg.style.fontSize = '12px';
          errorMsg.style.marginTop = '8px';
          img.parentNode.appendChild(errorMsg);
        };
        return img;
      } else if (type === 'video') {
        const video = ce('video');
        video.src = url;
        video.controls = true;
        video.style.maxWidth = '100%';
        video.style.borderRadius = '8px';
        video.style.marginTop = '8px';
        video.style.display = 'block';
        return video;
      } else if (type === 'youtube') {
        const iframe = ce('iframe');
        iframe.src = url;
        iframe.width = '100%';
        iframe.height = '315';
        iframe.frameBorder = '0';
        iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.style.borderRadius = '8px';
        iframe.style.marginTop = '8px';
        iframe.style.display = 'block';
        return iframe;
      } else if (type === 'vimeo') {
        const iframe = ce('iframe');
        iframe.src = url;
        iframe.width = '100%';
        iframe.height = '315';
        iframe.frameBorder = '0';
        iframe.allow = 'autoplay; fullscreen; picture-in-picture';
        iframe.allowFullscreen = true;
        iframe.style.borderRadius = '8px';
        iframe.style.marginTop = '8px';
        iframe.style.display = 'block';
        return iframe;
      }
      return null;
    }

        return `There are the following 4-types of applications that can be created using Java programming:

      if(/difference between jdk, jre, and jvm/.test(q)) {
      return `JDK, JRE, and JVM are three components form the core of the Java platform and are closely related, but each has a distinct role in Java development and execution. Before learning Java in depth, it is important to understand the difference between JDK, JRE, and JVM.

In this chapter, we will first learn what are JDK, JRE, and JVM, and how they are different from each other.

JVM
JVM (Java Virtual Machine) is an abstract machine. It is called a virtual machine because it doesn't physically exist. It is a specification that provides a runtime environment in which Java bytecode can be executed. It can also run those programs that are written in other languages and compiled to Java bytecode.

JVMs are available for many hardware and software platforms. JVM, JRE, and JDK are platform dependent because the configuration of each OS is different from that of others. However, Java is platform independent. There are three notions of the JVM: specification, implementation, and instance.

The JVM performs the following main tasks:

Loads code
Verifies code
Executes code
Provides runtime environment
To read more JVM Architecture

JRE
JRE is an acronym for Java Runtime Environment. It is also written as Java RTE. The Java Runtime Environment is a set of software tools that are used for developing Java applications. It is used to provide the runtime environment. It is the implementation of JVM. It physically exists. It contains a set of libraries + other files that the JVM uses at runtime.

The implementation of JVM is also actively released by other companies besides Sun Microsystems.

JRE
JDK
JDK is an acronym for Java Development Kit. The Java Development Kit (JDK) is a software development environment that is used to develop Java applications and applets. It physically exists. It contains JRE + development tools.

JDK is an implementation of any one of the below given Java Platforms released by Oracle Corporation:

Standard Edition Java Platform
Enterprise Edition Java Platform
Micro Edition Java Platform
The JDK contains a private Java Virtual Machine (JVM) and a few other resources, such as an interpreter/loader (java), a compiler (javac), an archiver (jar), a documentation generator (Javadoc), etc., to complete the development of a Java Application.`;

        return `In Java, a variable is the name of memory location that are used like a container to store values during Java program execution. Every variable must be assigned a data type to define the kind of data it can hold. In Java, variables are categorized into three types: local, instance, and static variables. In this chapter, we will learn about the Java variables and types with the help of examples.

types of variables in java

      if (/data types in java/.test(q)) {
        return `In programming languages, data types specify the different sizes and values that can be stored in the variable or constants. Each data type is predefined, which makes Java a statically and strongly typed language. There are the following two types of data types in Java.

Primitive Data Types: The primitive data types include boolean, char, byte, short, int, long, float and double.
Non-Primitive Data Types: The non-primitive data types include Classes, Interfaces, String, and Arrays.
Java Data Types
Let's understand in detail.

Java Primitive Data Types
In Java, primitive data types are the building blocks of data manipulation. These are the basic data types.

In Java, there are mainly eight primitive data types which are as follows.

boolean data type
char data type
byte data type
short data type
int data type
long data type
float data type
double data type
Java is a statically typed programming language. It means all variables must be declared before their use. That is why we need to declare the variable's type and name. Let's discuss each data type one by one.

1. Boolean Data Type
In Java, the boolean data type represents a single bit of information with two possible states: true or false. The size of the Boolean data type is 1 byte (8 bits).

It is used to store the result of logical expressions or conditions. Unlike other primitive data types like int or double, boolean does not have a specific size or range. It is typically implemented as a single bit, although the exact implementation may vary across platforms.

Syntax:

boolean flag;  
Example
Boolean a = false;  
Boolean b = true;    
2. Byte Data Type
The byte data type in Java is a primitive data type that represents an 8-bits signed two's complement integer. It has a range of values from -128 to 127. Its default value is 0.

The byte data type is commonly used when working with raw binary data or when memory conservation is a concern, as it occupies less memory than larger integer types like int or long.

Syntax:

byte size;  
Example
byte a = 10;  
byte b = -20;  
3. Short Data Type
The short data type in Java is a primitive data type that represents a 16-bits signed two-complement integer. Its range of values is -32,768 to 32,767.

Similar to the byte data type, short is used when memory conservation is a concern, but more precision than byte is required. Its default value is 0.

Syntax:

short var;  
Example
short a = 10000;    
short b = -5000;  
4. int Data Type
The int data type in Java is a primitive data type that represents a 32-bits signed two's complement integer. It has a range of values from -2,147,483,648 to 2,147,483,647.

The int data type is one of the most commonly used data types. It is typically used to store whole numbers without decimal points. Its default value is 0.

Syntax:

int myInt = 54;  
In Java, int variables are declared using the int keyword. For example, int myInt = 54 ; declares an int variable named myInt and initializes it with the value 54. int variables can be used in mathematical expressions, assigned to other int variables, and used in conditional statements.

Remember: In Java SE 8 and later versions, we can use the int data type to represent an unsigned 32-bit integer. It has a value in the range [0, 232-1]. Use the Integer class to use the int data type as an unsigned integer.

Example
int a = 100000;    
int b = -200000;  
5. long Data Type
The long data type in Java is a primitive data type that represents a 64-bits signed two's complement integer. It has a wider range of values than int, ranging from - 9,223,372,036,854,775,808 to 9,223,372,036,854,775,807. Its default value is 0.0L or 0.0l.

The long data type is used when the int data type is not large enough to hold the desired value or when a larger range of integer values is needed.

Following are the different types of encoding used before the Unicode system.

ASCII (American Standard Code for Information Interchange): used for the United States

Why does Java use Unicode System?
There were a few limitations to the encoding techniques used before the Unicode system.

In every language, different letters are present and the code assigned to every letter is also different which means multiple languages have multiple codes for various letters.
Certain languages have many character sets, the code assigned to each character may vary in terms of length. For example, some character can be encoded with a single byte, other might require two or more bytes.
These problems led to finding a better solution for character encoding that is Unicode System.

What is Unicode System?
Unicode system is an international character encoding technique that can represent most of the languages around the world.
Unicode System is established by Unicode Consortium.
Hexadecimal values are used to represent Unicode characters.

UTF-8: It represents 8-bits (1 byte) long character encoding.
UTF-16: It represents 16-bits (2 bytes) long character encoding
UTF-32: It represents 32-bits (4 bytes) long character encoding.
To access a Unicode character the format starts with an escape sequence \ u followed by 4 digits hexadecimal value.
A Unicode character has a range of possible values starting from \ u0000 to \ uFFFF.
Some of the Unicode characters are

The Java switch statement executes one statement from multiple conditions. It is like an if-else-if ladder statement. The switch statement works with byte, short, int, long, enum types, String, and some wrapper types, such as Byte, Short, Integer, and Long. Since Java 7, we can use strings in the switch statement.

What Is switch Statement in Java?
The switch statement can be described as a control flow type statement used to manipulate the flow of program execution and invoke various branches of code based on the value of an expression.

In other words, the switch statement tests the equality of a variable against multiple values.

Rules and Constraints of Java Switch Statement
There are several rules and constraints of Java switch statement. Some of them are as follows:

There can be one or N case values for a switch expression.
The case value must be of switch expression type only. The case value must be literal or constant. It doesn't allow variables.
The case values must be unique. In case of a duplicate value, it renders a compile-time error.
The Java switch expression must be of byte, short, int, long (with its Wrapper type), enumsand string.
Each case statement can have a break statement, which is optional. When control reaches thebreak statement, it jumps to the control after the switch expression. If a break statement is not found, the next case is executed.
The case value can have a default label, which is optional.
In Java, the switch statement provides a more detailed alternative that avoids the use of nested or multiple if-else statements when associated with a single variable.

The syntax of the Java switch statement contains the switch keyword, which is followed by the expression that needs to be evaluated using parentheses. The mentioned expression must definitely evaluate to a definite data type, which is primitive such as int, char, or enum.

Syntax of Switch Statement
Here is the syntax of switch statement:

switch(expression) {      
case value1:      
 //code to be executed;      
 break;  //optional    
case value2:      
 //code to be executed;      
 break;  //optional    
......      
default:       
  Code to be executed if all cases are not matched.    
}

In Java, the switch statement can also contain a default label. The default label will be executed only in the situation when none of the case labels match the expression's value. Declaring a default label is considered optional, but it can be useful in the event of unexpected values or inputs.

Java Simple for Loop
A simple for loop is the same as C/C++. We can initialize the variable, check condition and increment/decrement value. It consists of four parts:

Initialization: It is the initial condition which is executed once when the loop starts. Here, we can initialize the variable, or we can use an already initialized variable. It is an optional condition.
Condition: It is the second condition which is executed each time to test the condition of the loop. It continues execution until the condition is false. It must return boolean value either true or false. It is an optional condition.
Increment/Decrement: It increments or decrements the variable value. It is an optional condition.
Statement: The statement of the loop is executed each time until the second condition is false.

A labelled for loop in Java is a for loop that has been assigned a label. Labels in Java provide a way to identify a block of code, making it possible to break out of or continue an outer loop from within a nested loop. This feature is particularly useful when working with nested loops and we need to control the flow of the outer loop from within an inner loop. Labels enhance the control flow in complex looping structures, allowing for more precise and flexible loop management.

We can have a name of each Java for loop. To do so, we use label before the for loop. It is useful while using the nested for loop as we can break/continue specific for loop.

Note: The break and continue keywords breaks or continues the innermost for loop respectively.
Syntax of the Java Labelled for Loop
It has the following syntax:

labelname:    
for(initialization; condition; increment/decrement){    
//code to be executed    
}

The Java for-each loop is a simple and easy way to go through elements of an array or collection one by one.

Java for-each Loop
The Java for-each loop or enhanced for loop is introduced since J2SE 5.0. It provides an alternative approach to traverse the array or collection in Java. It is mainly used to traverse the array or collection elements.

Advantages of Java for-each loop
The main advantage of the for-each loop is that it eliminates the possibility of common programming bugs, such as index-out-of-bound errors. It makes the code cleaner, shorter, and more readable. The loop is called a for-each loop because it processes each element one by one automatically

Limitations of for-each Loop
The drawback of the enhanced for loop is that it cannot traverse the elements in reverse order. Here, you do not have the option to skip any element because it does not work on an index basis. Moreover, you cannot traverse the odd or even elements only.

When to Use for-each Loop
However, it is recommended to use the Java for-each loop for traversing the elements of array and collection because it makes the code readable.

Syntax of for-each Loop
The syntax of Java for-each loop consists of data_type with the variable followed by a colon (:), then array or collection.

for(data_type variable : array | collection){  
//body of for-each loop  
}  
How for-each Loop Works?
The Java for-each loop traverses the array or collection until the last element. For each element, it stores the element in the variable and executes the body of the for-each loop.

The following are the steps:

The loop starts with the first element of the array or collection.
The current element is stored in the loop variable.
The statements inside the loop body are executed.
The process repeats for each element until the last element is reached.

What Is while Loop in Java?
The Java while loop is used to iterate a part of the program repeatedly until the specified Boolean condition is true. As soon as the Boolean condition becomes false, the loop automatically stops.

The while loop is considered as a repeating if statement. If the number of iteration is not fixed, it is recommended to use the while loop.

Increment / decrement statement

Here, condition is a boolean expression that determines whether the loop should continue iterating or not. The statements within the curly braces are executed repeatedly as long as the condition evaluates to true.

Parts of while Loop
The different parts of while loop are as follows:

i <=100  
2. Update Expression: Every time the loop body is executed, this expression increments or decrements loop variable.

Example:

i++;

        return `The break statement in Java is a powerful tool for controlling the flow of your program. It is used to exit a loop or switch statement prematurely. It allows us to customize the behavior of code based on specific conditions.

How do break statements work in Loops?
When a break statement is encountered inside a loop, the loop is immediately terminated and the program control resumes at the next statement following the loop.

Using break with Loops and Switch Statements
The Java break statement is used to break loop or switch statement. It breaks the current flow of the program at specified condition. In case of inner loop, it breaks only inner loop.

Practical Example of break Statement
For example, consider a situation if we are searching for a specific value in an array using a for loop. We can use the break statement to exit the loop as soon as we find the value, like this:

int[] array = {1, 2, 3, 4, 5};  
int targetValue = 3;  
for (int i = 0; i < array.length; i++) {  
    if (array[i] == targetValue) {  
        System.out.println("Value found at index " + i);  
        break;  
    }  
}  
In this example, as soon as the value 3 is found in the array, the break statement is executed, and the loop is terminated. Without the break statement, the loop would continue iterating through the remaining elements of the array that is unnecessary once the value has been found.

Overall, the break statement is a versatile tool that allows us to customize the flow of Java programs, making them more efficient and easier to read. However, it is important to use break judiciously and understand its impact on the flow of code to avoid unintended consequences.

Use of break Statement
We can use Java break statement in all types of loops such as for loop, while loop and do-while loop.

Syntax of the break Statement
jump-statement;    
break;   
Flowchart of break Statement
The flowchart of a break statement starts with the condition check of the loop. If the condition is true, the loop body is executed, and then the condition is checked again. If the condition becomes false, the loop is exited normally, and the program continues with the statement after the loop.

However, if a break statement is encountered inside the loop body, the control jumps to the statement immediately after the loop, bypassing the normal exit condition check. This behavior allows us to prematurely exit a loop based on certain conditions, even if the loop's condition is still true.

It is important to note that a break statement only affects the innermost loop that contains it. If we have nested loops and we use a break statement in the inner loop, only that inner loop will be exited, and the outer loops will continue executing normally unless they also have their own break statements.

How to continue Statement Works?
The Java continue statement is used to continue the loop. It continues the current flow of the program and skips the remaining code at the specified condition. In case of an inner loop, it continues the inner loop only. Unlike the break statement, continue only interrupts the ongoing iteration and resumes control at the beginning of the next iteration.

We can use Java continue statements in all types of loops, such as for loops, while loops, and do-while loops.

Syntax of continue Statement
It has the following syntax:

jump-statement;      
continue;     
When executed, continue causes the loop to skip the remaining code in the current iteration and immediately proceed to the next iteration. In the case of nested loops, continue affects only the innermost loop.

            if (i == 5) {

            }  
            System.out.println(i);

Example of Polymorphism
Example
class Animal {  
    // Method Overloading (compile-time polymorphism)  
    void sound() {  
        System.out.println("An animal makes a sound");  
    }  
    void sound(String type) {  
        System.out.println("Animal sound: " + type);  
    }  
}  
class Dog extends Animal {  
    // Method Overriding (runtime polymorphism)  
    @Override  
    void sound(String type) {  
        System.out.println("Dog barking is: " + type);  
    }  
}  
public class Main {  
    public static void main(String[] args) {  
        Animal a = new Animal();  
        Dog d = new Dog();  
        Animal poly = new Dog();   
        // Method Overloading  
        a.sound();  
        a.sound("Generic");  
        // Method Overriding  
        d.sound("Loud");  
        // Performing the Polymorphism   
        poly.sound("Soft");  
    }  
}

An animal makes a sound

Advantage of Naming Conventions in Java
By using standard Java naming conventions, you make your code easier to read for yourself and other programmers. Readability of a Java program is very important. It indicates that less time is spent figuring out what the code does.

Enhanced Maintainability: Consistent naming conventions make it easier to maintain and update the code. Developers can quickly understand the purpose and usage of different components, reducing the time and effort required for modifications and debugging.
Improved Collaboration: Adhering to naming conventions when working in a team ensures that all team members can understand and contribute to the codebase more efficiently. It also reduces the learning curve for new developers and facilitates smoother code reviews and pair programming sessions.
Reduced Errors: Clear and consistent naming helps prevent errors that can arise from misinterpreting the role of variables, methods, or classes. It reduces the likelihood of introducing bugs due to misunderstandings about what a piece of code is supposed to do.
Code Consistency: Naming conventions promote a uniform coding style across the project, making the codebase look coherent and professional. This uniformity is crucial for large projects where multiple developers are contributing code over an extended period.
Better Integration with Development Tools: Many development tools, such as IDEs and static code analysers, are designed to work well with standard naming conventions. When these conventions are followed, these tools can provide better code completion, refactoring, and error detection.

A class is a group of objects that have common properties. It is a template or blueprint from which objects are created. It is a logical entity. It can't be physical.

A Java class contains:

Class in Java
1. Fields
Variables stated inside a class that indicate the status of objects formed from that class are called fields, sometimes referred to as instance variables. They specify the data that will be stored in each class object. Different access modifiers, such as public, private, and protected, can be applied to fields to regulate their visibility and usability.

2. Methods
Methods are functions defined inside a class that include the actions or behaviors that objects of that class are capable of performing. These techniques allow the outside world to function and change the object's state (fields). Additionally, methods can be void (that is, they return nothing) or have different access modifiers. They can also return values.

3. Constructors
Constructors are unique methods that are used to initialize class objects. When an object of the class is created using the new keyword, they are called with the same name as the class. Constructors can initialize the fields of an object or carry out any additional setup that's required when an object is created.

4. Blocks
Within a class, Java allows two different kinds of blocks: instance blocks, commonly referred to as initialization blocks and static blocks. Static blocks, which are usually used for static initialization, are only executed once when the class is loaded into memory. Instance blocks can be used to initialize instance variables and are executed each time a class object is generated.

5. Nested Class and Interface
Java permits the nesting of classes and interfaces inside other classes and interfaces. The members (fields, methods) of the enclosing class are accessible to nested classes, which can be static or non-static. Nested interfaces can be used to logically group related constants and methods together because they are implicitly static.

Abstraction: Methods provide a way to encapsulate implementation details, exposing only the necessary parts to the users.

What is a Constructor in Java?
A Constructor in Java is a block of codes like the method. It is called when an instance of the class is created. At the time of calling constructor, memory for the object is allocated in the memory. It is a special type of method which is used to initialize the object.

Every time when we create an object by using the new keyword, it calls a default constructor. If there is no constructor available in the class. In such case, Java compiler provides a default constructor by default.

Note: It is called constructor because it constructs the values at the time of object creation. It is not necessary to write a constructor for a class. Because Java compiler creates a default constructor if your class does not have any.
Rules for Creating Java Constructor
Here are the rules, you must follow to create constructors in Java:

1. Constructor name must be the same as its class name
A constructor must have the same name as the class. This helps the Java compiler identify the constructor and use it while creating an object.

Syntax:

It has the following syntax:

class Student {  
    Student() {  
        System.out.println("Constructor called");  
    }  
}  
Here, Student() is the constructor because its name matches the class name Student.

2. A constructor must have no explicit return type
A constructor does not return any value, not even void. If you specify a return type, it will be treated as a normal method, not a constructor.

Incorrect Example:

class Test {  
    void Test() {   // This is NOT a constructor  
        System.out.println("Not a constructor");  
    }  
}  
Correct Example:

class Test {  
    Test() {  
        System.out.println("This is a constructor");  
    }  
}  
Here, in the correct example, we removed the return type "void" so it makes Test() a valid constructor.

3. A Java constructor cannot be abstract, static, final, or synchronized
Constructors are used to create and initialize objects, so Java does not allow these modifiers with constructors.

Incorrect Example:

class Demo {  
    static Demo() {   // Compilation error  
    }  
}  
Correct Example:

class Demo {  
    Demo() {  
        System.out.println("Object created");  
    }  
}  
Here, in the correct example, we removed "static" keyword that makes Demo() constructor valid.

Note: We can use access modifiers while declaring a constructor. It controls the object creation. A constructor may be private, protected, public or default.
Types of Java Constructors
There are two types of constructors in Java:

Default Constructor (No-arg Constructor):
The default constructor does not take any parameters and is used to initialize an object with default values. If no constructor is defined, Java automatically provides a default constructor.
Parameterized Constructor:
The parameterized constructor accepts parameters and is used to initialize an object with specific values at the time of object creation.
Copy Constructor:
A copy constructor is a special type of constructor that is commonly utilized to create a new object by copying the values of an existing object of the same class.

Uses of static Keyword
Beyond memory management, the static keyword in Java has several other uses. When it comes to variables, it means that all instances of the class share the variable and belong to the class as a whole, not just any one instance.

Static methods are available throughout the program since they can be called without first generating an instance of the class. When the class loads, static blocks are used to initialise static variables or carry out one-time operations.

Furthermore, nested static classes can be instantiated individually but are still linked to the outer class. Moreover, class names can be used to access static variables and methods directly, eliminating the need to build an object instance. This is especially helpful for constants or utility methods.

Characteristics of static Keyword
Here are the characteristics of the static keyword:

Belongs to the Class, Not the Object: Anything marked as static is tied to the class itself, not individual objects. It means all objects share the same static variables and methods.
Access Without an Object: Since static members belong to the class, you can access them directly using the class name (ClassName.methodName()). No need to create an object.
Static Methods Cannot Use Instance Variables Directly: A static method does not know about specific objects, so it cannot directly access non-static (instance) variables or methods.
Main Method is Static: The main method in Java is static so that Java can run the program without creating an object first.
Executed Once When the Class is Loaded: A static block runs once when the class is first loaded, making it useful for initializing things like constants.
Not Overridden Like Normal Methods: Static methods do not follow typical method overriding. If a subclass defines the same static method, it's more like re-declaring it rather than overriding it.

Understanding Method Overloading with Examples
Suppose you have to perform the addition of the given numbers, but there can be any number of arguments if you write the method such as a(int,int) for two parameters, and b(int,int,int) for three parameters then it may be difficult for you as well as other programmers to understand the behavior of the method because its name differs. Here's an explanation with real-life examples:

public class MathOperations {

    public double add(double a, double b, double c) {  
        return a + b + c;  
    }  
}  
Here, the add() method is overloaded to handle both adding two integers and adding three doubles.

2. String Manipulation
In a utility class for string manipulation, you might have overloaded methods for concatenating strings:

public class StringUtils {  
    public String concatenate(String str1, String str2) {  
        return str1 + str2;  
    }

Method Overloading and the main() Method
The main() method can be overloaded in Java which is technically correct. But, it won't be considered as the entry point for the Java Virtual Machine (JVM) to start the execution of the program. While overloading the main() method is syntactically valid, it does not serve the purpose of being the entry point for program execution.

The JVM expects the standard signature public static void main(String[] args) for the entry point. Any other overloaded main() method will be treated as a regular method and will not be invoked by the JVM to start the program.

Therefore, although overloading main() is possible, it's not practically useful for program execution. Let's see a simple example.

    public static void main(String args) {    
        System.out.println("main with String");    
    }    
    // Overloaded main method with no parameters    
    public static void main() {    
        System.out.println("main without args");

Usage of Java Method Overriding
The following points describe the uses of method overriding in Java:

Method overriding is used to provide the specific implementation of a method that is already provided by its superclass.
Method overriding is used for runtime polymorphism.
Method overriding allows subclasses to reuse and build upon the functionality provided by their superclass, reducing redundancy and promoting modular code design.

Rules for Java Method Overriding
The following are the important rules of method overriding in Java:

Same Method Name: The overriding method in the subclass must have the same name as the method in the superclass that it is overriding.
Same Parameters: The overriding method must have the same number and types of parameters as the method in the superclass. This ensures compatibility and consistency with the method signature defined in the superclass.
IS-A Relationship (Inheritance): Method overriding requires an IS-A relationship between the subclass and the superclass. This means that the subclass must inherit from the superclass, either directly or indirectly, to override its methods.
Same Return Type or Covariant Return Type: The return type of the overriding method can be the same as the return type of the overridden method in the superclass, or it can be a subtype of the return type in the superclass. This is known as the covariant return type, introduced in Java 5.
Access Modifier Restrictions: The access modifier of the overriding method must be the same as or less restrictive than the access modifier of the overridden method in the superclass. Specifically, a method declared as public in the superclass can be overridden as public or protected but not as private. Similarly, a method declared as protected in the superclass can be overridden as protected or public but not as private. A method declared as default (package-private) in the superclass can be overridden with default, protected, or public, but not as private.
No Final Methods: Methods declared as final in the superclass cannot be overridden in the subclass. Because final methods cannot be modified or extended.
No Static Methods: Static methods in Java are resolved at compile time and cannot be overridden. Instead, they are hidden in the subclass if a method with the same signature is defined in the subclass.

Static Methods and Method Overriding
Static methods cannot be overridden in Java. When a subclass declares a static method with the same signature as a static method in its superclass, it does not override the method; instead, it hides the superclass method. As a result, the method that gets executed is determined at compile time based on the reference type, not at runtime based on the actual object type. Therefore, static methods do not support runtime polymorphism like instance methods.

Method overriding is based on dynamic method dispatch, where the method call is resolved at runtime according to the actual object. However, static methods are associated with the class itself, not with individual objects, and hence they are resolved at compile time. Because of this, static methods are not eligible for dynamic dispatch and cannot be overridden.

Additionally, there is a difference in how static and instance methods are handled in memory. Instance methods are invoked through objects and are tied to the heap memory, while static methods are stored in the method area of the JVM and are shared among all instances of the class. Due to these fundamental differences in behavior, binding, and memory allocation, static methods cannot participate in method overriding.

Method Overriding and main() Method
The main() method in cannot be overridden because it is declared as static. The main() method is defined as public static void main(String[] args) and serves as the entry point of program execution.

Static methods belong to the class, not to objects, so they do not support runtime polymorphism. They are resolved at compile time, which makes method overriding impossible. Therefore, even if a subclass defines a main() method with the same signature, it does not override the superclass method, and the main() method cannot be overridden in Java.

Characteristics of super Keyword
The following are the main characteristics of the super keyword in Java:

1. Calling the Parent Class Constructor
When we create an object of a subclass, Java automatically calls the constructor of the parent class. If we want to call the parent class constructor explicitly, we can use super(). It is typically done to ensure that the parent class is properly initialized before the child class starts.

2. Calling a Parent Class Method
If a method in the parent class is overridden in the child class, the child class can still call the parent class's version of that method using super.methodName(). It is useful when the child class wants to extend or add extra functionality to the method, but still needs to use the original functionality from the parent.

3. Accessing Parent Class Fields
If both the parent and child classes have variables (fields) with the same name, super allows the child class to access the parent class's version of the field. It helps avoid confusion between the two variables and makes it clear that we are referring to the one in the parent class.

4. First Statement in Constructor
When using super() to call the parent class's constructor, it must be the very first statement in the child class's constructor. It ensures that the parent class is initialized before the child class starts its own initialization.

5. Cannot Be Used in Static Contexts
The super keyword cannot be used in static methods or static variables. It is because static methods and variables belong to the class itself, not to a specific object. Since super refers to the parent class of an object, it's not allowed in static contexts.

6. Not Always Necessary
If the parent class's method is not overridden in the child class, we don't need to use super to call the parent class's method. The child class will automatically call the parent class's method when the method is invoked.`;

The word polymorphism is derived from two Greek words: poly and morphs. The word <poly means many, and morphs means forms. Therefore, polymorphism means many forms.

There are two types of polymorphism in Java:

Compile-time Polymorphism
Runtime Polymorphism.
We can perform polymorphism in Java by method overloading and method overriding.

1. Java Compile-Time Polymorphism
In Java, method overloading is used to achieve compile-time polymorphism. Using method overloading, a class can have multiple methods with the same name but different parameter lists. The compiler determines which method to call at compile time based on the number, type, and order of parameters passed.

In method overloading, methods must have the same name but must differ in the number or data types of parameters. When a method is called, the compiler selects the most suitable overloaded method based on the arguments provided. If an exact match is found, that method is invoked; otherwise, the compiler applies type promotion to find the closest matching method.

Example of Compile-Time Polymorphism
The following example demonstrates the implementation of compiler-time polymorphism using method overloading:

Example
class Calculation {    
    int add(int a, int b) {    
        return a + b;    
    }    
    double add(double a, double b) {    
        return a + b;    
    }    
}    
public class Main {    
    public static void main(String[] args) {    
        Calculation calc = new Calculation();    
        // Compile-time polymorphism: selecting the appropriate add method based on parameter types    
        System.out.println("Sum of integers: " + calc.add(5, 3));    
        System.out.println("Sum of doubles: " + calc.add(2.5, 3.7));    
    }    
}    
Output:

Sum of integers: 8
Sum of doubles: 6.2
Explanation

In this example, the Calculation class has two add methods-one accepting two integers and the other allowing two doubles. The types of arguments given in the method call decide which add method the compiler calls during compilation. This choice is made at compile time, proving polymorphism.

2. Runtime Polymorphism in Java
Runtime polymorphism, also known as Dynamic Method Dispatch, is a process in which the call to an overridden method is resolved at runtime rather than at compile time.

In this process, an overridden method is invoked using a superclass reference variable that refers to a subclass object. The method that gets executed is determined by the actual object being referred to, not by the reference type.

Let's first understand the upcasting before Runtime Polymorphism.

Upcasting
If the reference variable of Parent class refers to the object of Child class, it is known as upcasting. For example:

For upcasting, we can use the reference variable of class type or an interface type. For Example:

interface I{}  
class A{}  
class B extends A implements I{}  
Here, the relationship of B class would be:

B IS-A A
B IS-A I
B IS-A Object
Since Object is the root class of all classes in Java, so we can write B IS-A Object.

Since method invocation is determined by the JVM not compiler, it is known as runtime polymorphism.

There are several advantages of Polymorphism in Java. Some of them are as follows:

1. Code Reusability

Polymorphism allows methods in subclasses to override methods in their superclass, enabling code reuse and maintaining a consistent interface across related classes.

2. Flexibility and Extensibility

Polymorphism allows subclasses to provide their own implementations of methods defined in the superclass, making it easier to extend and customize behavior without modifying existing code.

3. Dynamic Method Invocation:

Polymorphism enables dynamic method invocation, where the method called is determined by the actual object type at runtime, providing flexibility in method dispatch.

4. Interface Implementation:

Interfaces in Java allow multiple classes to implement the same interface with their own implementations, facilitating polymorphic behavior and enabling objects of different classes to be treated interchangeably based on a common interface.

5. Method Overloading:

Polymorphism is also achieved through method overloading, where multiple methods with the same name but different parameter lists can be defined within a class or its subclasses, enhancing code readability and allowing flexibility in method invocation based on parameter types.

6. Reduced Code Complexity:

Polymorphism helps reduce code complexity by promoting a modular and hierarchical class structure, making it easier to understand, maintain, and extend large-scale software systems.`;

Abstraction is the process of hiding implementation details and showing only the required functionality to the user. In other words, it displays only the essential features while hiding internal details.

For example, when sending an SMS, we type the message and send it without knowing how the message is processed or delivered internally.

Abstraction allows you to focus on what an object does rather than how it does it.

What is Abstract Class in Java?
A class declared using the abstract keyword is known as an abstract class in Java. It can contain both abstract methods (methods without a body) and non-abstract methods (methods with a body).

An abstract class provides partial abstraction. It cannot be created on its own and is used only as a parent class. It defines a common structure and shared behavior, while child classes provide their own implementations. Abstract methods do not have a body and must be implemented by the subclasses.

Inheritance of Interfaces
A class implements an interface, whereas an interface can extend another interface. When one interface extends another, it inherits all the abstract methods of the parent interface.

A class that implements the child interface must provide implementations for all methods declared in both the parent and child interfaces.

 }

One of the main benefits of interfaces is that they support polymorphism. An interface reference can point to any object of a class that implements it. This allows the program to decide at runtime which method implementation to use.

The following example demonstrates how an interface reference can point to an object of a class that implements it, showing polymorphic behavior.

    void eat();  
    void sleep();  
}

        System.out.println("Dog is sleeping");  
    }

}

It is easier to scale applications because it provides flexibility to add or modify features without impacting the entire codebase.

Advantages of Encapsulation in Java
Encapsulation offers various advantages, especially ensuring code organization and better design.

Array length Attribute
Java provides an attribute length that determines the length of an array. Every array has an in-built length property whose value is the size of the array. Size implies the total number of elements that an array can contain. The length property can be invoked by using the dot (.) operator followed by the array name. We can find the length of int[], double[], String[], etc. For example:

How to Find Array Length in Java

If we talk about the logical size, the index of the array, then simply int arrayLength=arr.length-1, because the array index starts from 0. So, the logical or array index will always be less than the actual size by 1.

Jagged arrays are also known as "ragged arrays" or "irregular arrays". They can be created by specifying the size of each array in the declaration.

For example, a jagged array with three rows can have the first row with three elements, the second with two elements, and the third with four elements.

Jagged Array Declaration
A jagged array is declared by first specifying the number of rows and then allocating each row separately with different column sizes.

Syntax
Here is the syntax of declaring a jagged array:

datatype[][] arrayName = new datatype[numRows][];  
arrayName[0] = new datatype[numColumns1];  
arrayName[1] = new datatype[numColumns2];  
...  
arrayName[numRows-1] = new datatype[numColumnsN];  
Here, the datatype is the data type of the elements in the array, numRows is the number of rows in the jagged array, and numColumns1, numColumns2, ..., numColumnsN are the number of columns in each row. Users should be aware that the number of columns in each row is flexible.

The first line creates an array of arrays with numRows rows. Each row is initialized to null by default.

The subsequent lines initialize each row of the jagged array. You create a new one-dimensional array of numColumns elements for each row and assign it to the corresponding row in the jagged array.

4. Java program to find the second most significant element in a sorted matrix.
In a sorted matrix, the rows and columns of the elements are placed in ascending order. We can navigate the matrix and note the largest and second-largest elements to determine the second-largest element. The second-largest element will have been stored when the traverse is complete.

The program uses a simple approach to find the second-largest element in a sorted matrix. It applies a nested loop to traverse the matrix in reverse order and compares each element with the largest and second-largest elements found so far. The program updates the largest and second-largest variables accordingly. Finally, it prints the value of the second-largest element.

Code
public class Main  
{    
    public static void main(String[] args)     
    {    
        int[][] matrix =     
        {    
            {1,2,3},    
            {4,5,6},    
            {7,8,9}    
        };    
        int rows=matrix.length;    
        int cols=matrix[0].length;    
        int largest=matrix[rows-1][cols-1]; // Initialize largest with the bottom-right element    
        int secondLargest=matrix[rows-1][cols-2]; // Initialize secondLargest with the element before largest    
            
        // Traverse the matrix in reverse order    
        for (int i=rows-1;i>=0;i--)     
        {    
            for (int j=cols-1;j>=0;j--)     
            {    
                if (matrix[i][j]>largest)     
                {    
                    secondLargest=largest; // Update secondLargest to the previous largest    
                    largest=matrix[i][j]; // Update largest to the new largest element    
                }     
              else if(matrix[i][j]>secondLargest&&matrix[i][j]<largest)     
                {    
                    secondLargest=matrix[i][j];     
                }    
            }    
        }    
        System.out.println("Second largest element in the sorted matrix is: "+secondLargest);    
    }    
}

5. Java program to find the k-th smallest element in a sorted matrix.
In a sorted matrix, elements are arranged in ascending order, both row-wise and column-wise. The task is to find the kth smallest element in the matrix.

The program uses a min-heap implemented with a PriorityQueue to find the kth smallest element in a sorted matrix. The findKthSmallest() method initializes the minHeap and adds the elements from the first column. It then performs k-1 iterations, extracting the minimum element, finding its indices, and adding the next element from the same row to the minHeap. Finally, the method returns the kth smallest element. The main function showcases the method by providing a sample matrix and k value.

Code
import java.util.*;    
public class Main    
{    
    public static int findKthSmallest(int[][] matrix,int k)     
    {    
        int rows=matrix.length;    
        int cols=matrix[0].length;    
        PriorityQueue<Integer> minHeap=new PriorityQueue<>();    
        for (int i=0;i<rows;i++) {    
            minHeap.add(matrix[i][0]);    
        }    
        // Perform k-1 iterations    
        for (int i=0;i<k-1;i++)     
        {    
            int minElement=minHeap.poll(); // Extract the minimum element    
            // Get the row and column index of the extracted element    
            int rowIndex=-1;    
            int colIndex=-1;    
            for (int j=0;j<rows;j++)     
            {    
                for (int p=0;p<cols;p++)     
                {    
                    if (matrix[j][p]==minElement)     
                    {    
                        rowIndex=j;    
                        colIndex=p+1;    
                        break;    
                    }    
                }    
            }    
            // Add the next element from the same row to the min-heap    
            if (colIndex<cols) {    
                minHeap.add(matrix[rowIndex][colIndex]);    
            }    
        }    
        return minHeap.peek(); // Return the kth smallest element    
    }    
    public static void main(String[] args)     
    {    
        int[][] matrix={    
            {1,3,5},    
            {6,7,12},    
            {11,14,14}    
        };    
        int k=4;    
        int kthSmallest=findKthSmallest(matrix,k);    
        System.out.println("The "+ k+"-th smallest element in the sorted matrix is: "+kthSmallest);    
    }    
}    
Output:

The 4-th smallest element in the sorted matrix is: 6
Complexity Analysis

Time Complexity: The time complexity is O(k * log(rows)).

Space Complexity: The space complexity is O(rows) for storing the elements in the min-heap.

In a sorted array, duplicate elements may occur consecutively. To put off duplicates from a looked-after array, we need to adjust the array in-place, making sure that each detail appears as effective as soon as. The Java program removes duplicates from a sorted array using the "RemoveDuplicates" class. The method "removeDuplicates" returns the new length of the modified array without duplicates. It checks if the array is empty, initializes "nextUnique" to 1, and traverses the array starting from the second element. It assigns unique elements to the position of "nextUnique" and increments it. After the loop, "nextUnique" represents the new length. The "main" function showcases the method by printing the modified array.

import java.util.*;    
public class Main    
{    
    public static int removeDuplicates(int[] nums)     
    {    
        int n=nums.length;    
        if (n==0)     
        {    
            return 0;     
        }    
        int nextUnique=1;     
        // Pointer to track the position of the next unique element    
        // Traverse the array starting from the second element    
        for (int current=1;current<n;current++)     
        {    
            // Compare the current element with the element at the next unique - 1    
            if (nums[current]!=nums[nextUnique-1])     
            {    
   nums[nextUnique]=nums[current]; // Assign current element to nextUnique position    
                nextUnique++; // Increment nextUnique    
            }    
        }

8. Java program to find the missing number in a sorted array of consecutive integers.
Using the binary search method, we locate the missing integer in a sorted array of succeeding integers. The first detail's index is low, and the remaining is high. We determine whether or not the missing integer is on the left or proper side of the array by computing the expected value for the middle element, which ought to be the same as the first element plus the centre index. The operation is repeated until there is only one element left in the search space, at which point we update low or high as necessary. The missing number will be the expected value at the index low.

Code
public class Main   
{    
    public static int findMissingNumber(int[] nums)     
    {    
        int low=0;    
        int high=nums.length-1;    
        // Perform binary search    
        while (low<=high)     
        {    
            int mid=low+(high-low)/2;    
            int expectedValue=nums[0]+mid;    
            if (nums[mid]==expectedValue)     
            {    
                // Missing number lies in the right half    
                low=mid+1;    
            } else     
            {    
                // Missing number lies in the left half    
                high=mid-1;    
            }    
        }    
        // Return the missing number    
        return nums[0]+low;    
    }    
    public static void main(String[] args)     
    {    
        int[] nums={1,2,3,4,6,7,8,9};    
        int missingNumber=findMissingNumber(nums);    
        System.out.println("Missing number: "+missingNumber);    
    }    
}

public class Main  {    
    public static void rotateClockwise(int[][] matrix)  {    
        int rows=matrix.length;    
        int cols=matrix[0].length;

        for (int i=0;i<rows;i++)    {    
            for (int j=i;j<cols;j++)   {    
                int temp=matrix[i][j];    
                matrix[i][j]=matrix[j][i];

                matrix[i][left]=matrix[i][right];

                right--;    
            }    
        }    
    }

We might also describe the Fibonacci sequence as a matrix and calculate matrix multiplication to compute the Fibonacci numbers using matrix exponentiation speedily. The manner includes creating a transformation matrix that represents the Fibonacci series, utilizing matrix multiplication and exponentiation strategies, and then elevating the matrix to the necessary power using the powerMatrix approach. By deleting the Fibonacci number from the following matrix, we can also quickly calculate Fibonacci numbers.

Code
public class Main {    
    public static long computeFibonacci(int n)   {    
        if (n<=0)   {    
            return 0;    
        }    
        // Fibonacci transformation matrix    
        long[][] fibMatrix = {{1, 1}, {1, 0}};    
        // Raise fibMatrix to the power of (n-1)    
        fibMatrix = powerMatrix(fibMatrix, n - 1);    
        // Extract the Fibonacci number from the matrix    
        return fibMatrix[0][0];    
    }    
    private static long[][] powerMatrix(long[][] matrix, int power) {    
        if (power == 0) {    
            // Identity matrix    
            return new long[][]{{1, 0}, {0, 1}};    
        }    
        if (power == 1) {    
            return matrix;    
        }    
        long[][] result = powerMatrix(matrix, power / 2);    
        result = multiplyMatrices(result, result);    
        if (power % 2 != 0) {    
            result = multiplyMatrices(result, matrix);    
        }    
        return result;    
    }    
    private static long[][] multiplyMatrices(long[][] matrix1,long[][] matrix2)    {    
        long[][] result=new long[2][2];    
        result[0][0]=matrix1[0][0]*matrix2[0][0]+matrix1[0][1]*matrix2[1][0];    
        result[0][1]=matrix1[0][0]*matrix2[0][1]+matrix1[0][1]*matrix2[1][1];    
        result[1][0]=matrix1[1][0]*matrix2[0][0]+matrix1[1][1]*matrix2[1][0];    
        result[1][1]=matrix1[1][0]*matrix2[0][1]+matrix1[1][1]*matrix2[1][1];    
        return result;    
    }

import java.util.ArrayList;

    public static List<Integer> intersection(int[] nums1, int[] nums2) {

        List<Integer> result=new ArrayList<>();

        for (int num:nums1)  {

        for (int num:nums2)   {

22. Java program to find the longest subarray with an equal number of 0s and 1s.
Utilizing the prefix sum method, we can determine the longest subarray that contains an equal number of 0s and 1s. We can calculate the running sum while traversing the array by assigning a value of 1 for every 1 and -1 for every 0. When the running sum reaches zero, the number of 0s and 1s we have seen thus far is equal. To find the longest subarray, we store the running sum in a HashMap and its corresponding index. If the same running sum appears again, we update the maximum length by subtracting the stored index from the current index. By keeping track of the maximum length throughout the iteration, we can find the longest subarray with equal 0s and 1s.

Code
import java.util.HashMap;    
public class Main {    
    public static int findMaxLength(int[] nums)   {    
        int maxLength=0;    
        int runningSum=0;    
        HashMap<Integer,Integer> sumMap=new HashMap<>();    
        sumMap.put(0,-1); // Handle the case when the subarray starts from the beginning    
        for (int i=0;i<nums.length;i++)   {    
            runningSum+=nums[i]==0?-1:1;    
            if (sumMap.containsKey(runningSum))    {    
                int startIndex=sumMap.get(runningSum);    
                maxLength=Math.max(maxLength,i-startIndex);    
            } else {    
                sumMap.put(runningSum,i);    
            }    
        }    
        return maxLength;    
    }

28. Reverse an array without changing the position of zeroes.
To solve the problem, the method involves moving through the array from both ends and swapping non-zero elements until reaching the centre. Throughout this procedure, the positions of zeroes are left intact. The code employs a while loop to bypass zeroes while decrementing the index from the end. When a non-zero element is detected, it gets swapped with the corresponding non-zero element from the opposite end. This swapping continues until the centre of the array is reached.

Code
import java.util.Arrays;  
public class Main {  
// Print function  
public static void printReverse(int[] arr) {  
    // Print the original array  
    System.out.print("Original array: ");  
    System.out.println(Arrays.toString(arr));  
    // Reverse the array without changing the position of zeroes  
    // Initialize the index to the last element  
    int j = arr.length - 1;  
    for (int i = 0; i < j; i++) {  
    // If the current element is zero, skip to the next element  
    if (arr[i] == 0) {  
        continue;  
    }  
    // If the current element is zero from the end  
    while (j > i && arr[j] == 0) {  
        // Decrement the index to the previous element  
        j--;  
    }  
    // Swap the elements  
    int temp = arr[i];  
    arr[i] = arr[j];  
    arr[j] = temp;  
    // Decrement the index to the previous element  
    j--;  
    }  
    // Prints the reversed array  
    System.out.print("Reversed array: ");  
    System.out.println(Arrays.toString(arr));  
}  
public static void main(String[] args) {  
    int[] arr = { 6, 0, 8, 0, 2, 0, 1 };  
    printReverse(arr);  
}  
}

Original array: [6, 0, 8, 0, 2, 0, 1]
Reversed array: [1, 0, 2, 0, 8, 0, 6]

In Java, an array is a collection of the same data type that dynamically creates objects and can contain elements of primitive types. Java also allows us to store objects in an array.

Array of Objects
An array of objects is a collection of multiple objects stored in a single variable. It stores the references to the objects. It is useful when managing multiple instances of a class efficiently.

How to Create Array of Objects in Java
Creating an Array of Objects
Before creating an array of objects, we must create instances of the class using the new keyword. We can use any of the following statements to create an array of objects.

ClassName obj[]=new ClassName[array_length]; //declare and instantiate an array of objects  
Or

ClassName[] objArray;  
Or

ClassName objeArray[];  
Suppose, we have created a class named Employee. We want to keep records of 20 employees of a company having three departments. In this case, we will not create 20 separate variables. Instead of this, we will create an array of objects, as follows.

Employee department1[20];  
Employee department2[20];  
Employee department3[20];  
The above statements create an array of objects with 20 elements.

Initializing an Array of Objects
After the objects are instantiated, the array has to be initialized with values. In contrast to a variety of primitive types, an array of objects cannot be initialized in the same way. It is necessary to initialize each element or object in an array of objects. An array contains pointers to the real class through its objects.

Consequently, it is highly recommended to generate actual objects of the class after declaring and instantiating an array of objects. The constructors can set up the array. Actual objects can have their initial values assigned by the application by supplying values to the constructor. A class's independent member method can also be used to assign data to an object.

The elements of an array of objects must be initialized after they have been created. Two common approaches are available to perform this:

Using the Constructor
Using Setter Methods
Here, we are going to discuss approached one by one.

1. Using the Constructor
By providing variables to the constructor individually, we can define starting values for each object as the actual objects are being created. Every single real object is made with its unique values.

Example
// Java program to demonstrate initializing an array of objects using a constructor  
public class Main {  
    public static void main(String args[]) {  
        // Declaring an array of Book  
        Book[] books;  
        // Allocating memory for 3 Book objects  
        books = new Book[3];  
        // Initializing the elements of the array using the constructor  
        books[0] = new Book(101, "Java Basics");  
        books[1] = new Book(102, "Data Structures");  
        books[2] = new Book(103, "Operating Systems");  
        System.out.println("Book details:");  
        for (int i = 0; i < books.length; i++) {  
            books[i].display();  
        }  
    }  
}  
// Creating a Book class with id and title as attributes  
class Book {  
    public int bookId;  
    public String title;  
    // Book class constructor  
    Book(int bookId, String title) {  
        this.bookId = bookId;  
        this.title = title;  
    }  
    // display() method to display the book data  
    public void display() {  
        System.out.println("Book ID: " + bookId + ", Title: " + title);  
    }  
}  
Output:

Book details:
Book ID: 101, Title: Java Basics
Book ID: 102, Title: Data Structures
Book ID: 103, Title: Operating Systems
2. Using Setter Methods
Using setter methods, we may assign values after creating objects. The initial values of the objects are assigned using a member function of the corresponding class that is formed.

Example
// Java program to demonstrate initializing an array of objects using setter methods  
public class Main {  
    public static void main(String args[]) {  
        // Declaring an array of Book  
        Book[] books;  
        // Allocating memory for 3 objects of type Book  
        books = new Book[3];  
        // Creating actual Book objects  
        books[0] = new Book();  
        books[1] = new Book();  
        books[2] = new Book();  
        // Assigning data to Book objects using the setter method  
        books[0].setData(201, "Java Programming");  
        books[1].setData(202, "Algorithms");  
        books[2].setData(203, "Database Systems");  
        // Displaying the book data  
        System.out.println("Book details:");  
        for (int i = 0; i < books.length; i++) {  
            books[i].display();  
        }  
    }  
}  
// Creating a Book class with id and title as attributes  
class Book {  
    public int bookId;  
    public String title;  
    // Setter method to set the data

        this.bookId = bookId;  
        this.title = title;  
    }  
    // display() method to show book details  
    public void display() {  
        System.out.println("Book ID: " + bookId + ", Title: " + title);

Reversing an array is a common task that can be achieved using multiple approaches, such as using auxiliary array, two pointers, stack, or using the built-in methods. Here, we will learn these different techniques to reverse an array.

Problem Statement
In the input, an integer array is provided, and the task is to reverse the array. Reversing an array means the last element of the input array becomes the first element of the reversed array, the second-last element becomes the second element, and so on. Observe the following examples.

Example 1:

Input:

arr[] = {1, 2, 3, 4, 5, 6, 7, 8}

Output

arr[] = {8, 7, 6, 5, 4, 3, 2, 1}

Example 2:

Input:

arr[] = {4, 8, 3, 9, 0, 1}

Output:

arr[] = {1, 0, 9, 3, 8, 4}

Reverse an Array Using an Auxiliary Array
We can traverse the array from end to beginning, i.e., in reverse order, and store the element pointed by the loop index in the auxiliary array. The auxiliary array now contains the elements of the input array in reversed order. After that, we can display the auxiliary array on the console. See the following program.

Example
The following example demonstrates reversing an array using an auxiliary array.

public class ReverseArr  
{  
// method for reversing an array  
public int[]  reverseArray(int arr[])  
{  
    // computing the size of the array arr  
    int size = arr.length;  
      
    // auxiliary array for reversing the   
    // elements of the array arr  
    int temp[] = new int[size];  
      
    int index = 0;  
    for(int i = size - 1; i >= 0; i--)  
    {  
        temp[i] = arr[index];  
        index = index + 1;  
    }  
      
    return temp;  
      
}  
  
// main method  
public static void main(String argvs[])   
{  
  // creating an object of the class ReverseArr  
  ReverseArr obj = new ReverseArr();  
    
  // input array - 1  
  int arr[] = {1, 2, 3, 4, 5, 6, 7, 8};  
    
  // computing the length  
  int len = arr.length;  
  int ans[] = obj.reverseArray(arr);  
    
  System.out.println("For the input array: ");  
  for(int  i = 0; i < len; i++)  
  {  
     System.out.print(arr[i] + " ");  
  }  
    
  System.out.println();  
  System.out.println("The reversed array is: ");  
  for(int  i = 0; i < len; i++)  
  {  
     System.out.print(ans[i] + " ");  
  }  
    
  System.out.println("\n ");  
    
  // input array - 2  
  int arr1[] = {4, 8, 3, 9, 0, 1};  
    
  // computing the length  
  len = arr1.length;  
  int ans1[] = obj.reverseArray(arr1);  
    
  System.out.println("For the input array: ");  
  for(int  i = 0; i < len; i++)  
  {  
     System.out.print(arr1[i] + " ");  
  }  
    
  System.out.println();  
  System.out.println("The reversed array is: ");  
  for(int  i = 0; i < len; i++)

Reverse an Array Using Two Pointers
We can also use two pointers to reverse the input array. The first pointer will go to the first element of the array. The second pointer will point to the last element of the input array. Now we will start swapping elements pointed by these two pointers. After swapping, the second pointer will move in the leftward direction, and the first pointer will move in the rightward direction. When these two pointers meet or cross each other, we stop the swapping, and the array we get is the reversed array of the input array.

Example
The following example demonstrates reversing an array using two pointers.

public class ReverseArr1  
{

{

    int ptr1 = 0;  
    int ptr2 = size - 1;  
      
    // reversing the input array  
    // using a while loop  
    while(ptr1 < ptr2)  
    {  
        int temp = arr[ptr1];  
        arr[ptr1] = arr[ptr2];  
        arr[ptr2] = temp;  
          
        ptr1 = ptr1 + 1;  
        ptr2 = ptr2 - 1;  
    }  
      
    return arr;  
      
}

Reverse an Array Using Stack
Since a Stack works on the LIFO (Last In First Out) principle, it can be used to reverse the input array. All we have to do is to put all the elements of the input array in the stack, starting from left to right. We will do it using a loop.

Example
The following example demonstrates reversing an array using stack.

// importing Stack  
import java.util.Stack;  
  
  
public class ReverseArr2  
{  
// method for reversing an array  
public int[]  reverseArray(int arr[])  
{  
    // computing the size of the array arr  
    int size = arr.length;  
      
    Stack<Integer> stk = new Stack<Integer>();  
      
    // pusing all the elements into stack  
    // starting from left  
    for(int i = 0; i < size; i++)  
    {  
        stk.push(arr[i]);  
    }  
      
    int i = 0;  
    while(!stk.isEmpty())  
    {  
        int ele = stk.pop();  
        arr[i] = ele;  
        i = i + 1;  
    }  
      
    return arr;  
      
}

Explanation: The statement reverseArr.add(arr[i]); is written after the recursive call goes in the stack (note that the stack is implicit in this case). So, when the base case is hit in the recursive call, stack unwinding happens, and whatever is there in the stack pops out. The last element goes into the stack during the last recursive call. Therefore, the last element is popped out first. Then the penultimate element is popped out, and so on. The statement reverseArr.add(arr[i]); stores that popped element. In the end, we are displaying the elements that are stored in the list reverseArr.

Stack Overflow Error
The "Stack Overflow" error is a runtime error that occurs when a program exhausts its call stack due to excessive recursion. This error typically happens when a recursive function does not have a proper termination condition or when the recursion depth becomes too large.

if you try to calculate the factorial of a very large number, you may encounter a stack overflow error because the recursion depth becomes too deep. For example, if you try to calculate the factorial of a negative number or a very large positive number, it could lead to a stack overflow error.

To overcome the above error, follow the rules given below:

Ensure Proper Base Case: Make sure that your recursive function has a proper base case that will eventually terminate the recursion. In the factorial example, the base case is when n is 0 or 1.

Limit Recursion Depth: If possible, limit the maximum recursion depth or use iterative approaches for cases where recursion depth could become too large.

Optimize Recursion: Sometimes, we can optimize recursive algorithms to reduce the recursion depth or use tail recursion, which some compilers can optimize into iterative form.

For example, here is the factorial function with an additional check to prevent negative numbers:

        // Base case: if n is 0 or 1, factorial is 1    
        else if (n == 0 || n == 1)    
            return 1;    
        // Recursive case: if n is greater than 1, recursively call factorial function with n-1 and multiply it with n    
        else    
            return n * factorial(n - 1);    
    }    
}

        // Calculate factorial of 'num' using recursive factorial function
