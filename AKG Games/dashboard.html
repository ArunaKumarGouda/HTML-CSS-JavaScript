<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub Dashboard</title>
  <!-- Normalize default styles for consistency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-start: #0f172a; /* slate-900 */
      --bg-end: #1e293b;   /* slate-800 */
      --card-start: #22d3ee; /* cyan-400 */
      --card-end: #06b6d4;   /* cyan-500 */
      --text-primary: #e2e8f0; /* slate-200 */
      --text-muted: #cbd5e1;   /* slate-300 */
      --ring: rgba(34,211,238,0.35);
      --shadow-1: rgba(0,0,0,0.25);
      --shadow-2: rgba(0,0,0,0.45);
      --surface: rgba(255,255,255,0.06);
      --surface-strong: rgba(255,255,255,0.12);
    }

    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,0.15), transparent 40%),
                  radial-gradient(1000px 500px at 100% 0%, rgba(99,102,241,0.18), transparent 50%),
                  linear-gradient(135deg, var(--bg-start), var(--bg-end));
      background-size: 400% 400%;
      animation: bgAnimation 15s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-primary);
    }

    /* Fullscreen background video */
    .bg-video { position: fixed; inset: 0; z-index: -2; overflow: hidden; }
    .bg-video video { width: 100%; height: 100%; object-fit: cover; filter: saturate(1.1) brightness(0.6); }
    .bg-overlay { position: fixed; inset: 0; z-index: -1; background: radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,0.12), transparent 40%), linear-gradient(135deg, rgba(15,23,42,0.4), rgba(30,41,59,0.6)); }

    @keyframes bgAnimation {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    /* Top-left fixed date/time and logout */
    .top-left {
      position: fixed;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      z-index: 100;
    }

    .time-display {
      font-size: 14px;
      font-weight: 600;
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 10px;
      color: var(--text-muted);
      border: 1px solid var(--surface-strong);
      box-shadow: 0 6px 20px var(--shadow-1);
      backdrop-filter: blur(6px);
    }

    .logout {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--surface-strong);
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(180deg, #4f46e5, #0ea5e9);
      color: #fff;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      box-shadow: 0 8px 20px var(--shadow-1);
      transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
    }

    .logout:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px var(--shadow-2);
      filter: brightness(1.05);
    }

    .profile {
      margin-top: 40px;
      text-align: center;
    }

    .profile img {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.6);
      object-fit: cover;
      box-shadow: 0 16px 40px var(--shadow-2);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .profile img:hover {
      transform: scale(1.05);
      box-shadow: 0px 8px 25px rgba(0,0,0,0.6);
    }

    h1 {
      margin: 12px 0 4px 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .welcome {
      font-size: 16px;
      margin-bottom: 24px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .dashboard {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
      width: 92%;
      max-width: 1100px;
      margin-bottom: 28px;
    }

    /* Compact mode when searching */
    .dashboard.compact {
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px;
      max-width: 800px;
      width: 90%;
    }

    .card {
      background: linear-gradient(145deg, var(--card-start), var(--card-end));
      padding: 22px;
      border-radius: 16px;
      text-align: center;
      color: #022c22;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 10px 24px var(--shadow-1);
      border: 1px solid rgba(255,255,255,0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.2s ease;
      text-decoration: none;
      position: relative;
      isolation: isolate;
    }

    .dashboard.compact .card {
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px var(--shadow-2);
      filter: saturate(1.05);
    }

    .card i {
      font-size: 32px;
      margin-bottom: 10px;
      display: block;
    }

    .dashboard.compact .card i {
      font-size: 24px;
      margin-bottom: 8px;
    }

    /* Search bar */
    .searchbar {
      width: 92%;
      max-width: 1100px;
      margin: 14px auto 10px auto;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .searchbar input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--surface-strong);
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      color: var(--text-primary);
      box-shadow: 0 10px 26px var(--shadow-1);
      font-family: inherit;
    }
    .no-results {
      width: 92%;
      max-width: 1100px;
      margin: 8px auto 0 auto;
      color: var(--text-muted);
      font-weight: 600;
      display: none;
      text-align: left;
    }

    /* Subtle focus ring for accessibility */
    .card:focus-visible, .logout:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }

    /* Responsive tweaks */
    @media (max-width: 480px) {
      .profile img { width: 96px; height: 96px; }
      h1 { font-size: 22px; }
      .welcome { font-size: 14px; }
      .card { font-size: 16px; padding: 18px; }
      .card i { font-size: 28px; }
      .dashboard { gap: 16px; }
    }
  </style>
</head>
<body>
  <!-- Background gaming video -->
  <div class="bg-video" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto" poster="hd-nature.jpg">
      <source src="Asphalt 9_ Legends - Official Soft Launch Preview(720P_HD).mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>
  <!-- Top-left date/time and logout -->
  <div class="top-left">
    <div class="time-display" id="dateTime">Loading...</div>
    <button class="logout" onclick="window.location.href='index.html'">Logout</button>
  </div>

  <!-- Profile Section -->
  <div class="profile">
    <img src="Screenshot_2025_0517_115645.png" alt="Profile Picture">
    <h1>🎮 Game Hub Dashboard</h1>
    <p class="welcome">Welcome, Aruna 👋</p>
  </div>

  <!-- Game + Extra Pages -->
  <div class="searchbar" role="search">
    <input id="searchInput" type="text" placeholder="Search pages (e.g., car, weather, resume)..." aria-label="Search dashboard cards" />
  </div>
  <div id="noResults" class="no-results">Result not found</div>
  <div class="dashboard">
    <a href="games/tictactoe.html" class="card">
      <i class="fas fa-th"></i> Tic Tac Toe
    </a>
    <a href="games/car.html" class="card">
      <i class="fas fa-car"></i> Car Racing
    </a>
    <a href="games/running.html" class="card">
      <i class="fas fa-running"></i> Endless Runner
    </a>
    <a href="games/typing.html" class="card">
      <i class="fas fa-keyboard"></i> Typing Test
    </a>
    <a href="resume.html" class="card">
      <i class="fas fa-file"></i> Resume
    </a>
    <a href="Weather.html" class="card">
      <i class="fas fa-cloud-sun"></i> Weather
    </a>
    <a href="Calculator.html" class="card">
      <i class="fas fa-calculator"></i> Calculator
    </a>
    <a href="biodata.html" class="card">
      <i class="fas fa-copy"></i> Bio Data
    </a>
    <a href="chatboard.html" class="card">
      <i class="fas fa-file-circle-plus"></i> AI chatboard
    </a>
    <a href="Chess.html" class="card">
      <i class="fas fa-chess"></i> Chess
    </a>
    <a href="voice_assistant.html" class="card">
      <i class="fas fa-file-circle-plus"></i> Voice Assistant
    </a>
    <a href="Portfolio.html" class="card">
      <i class="fas fa-file-circle-plus"></i> Portfolio
    </a>
  </div>

<script>
  // Update date and time every second
  const dateTimeEl = document.getElementById('dateTime');
  function updateTime() {
    const now = new Date();
    dateTimeEl.textContent = now.toLocaleString();
  }
  setInterval(updateTime, 1000);
  updateTime();

  // Simple client-side search filter
  const searchInput = document.getElementById('searchInput');
  const dashboardEl = document.querySelector('.dashboard');
  const cards = Array.from(dashboardEl.querySelectorAll('.card'));
  const noResultsEl = document.getElementById('noResults');

  function normalize(s) { return (s || '').toLowerCase().trim(); }
  function matches(card, q) {
    const text = normalize(card.textContent);
    return text.includes(q);
  }
  function applyFilter(q) {
    const query = normalize(q);
    let visibleCount = 0;
    cards.forEach(card => {
      const show = !query || matches(card, query);
      card.style.display = show ? '' : 'none';
      if (show) visibleCount++;
    });
    noResultsEl.style.display = visibleCount === 0 ? 'block' : 'none';
    // Toggle compact layout when searching
    dashboardEl.classList.toggle('compact', !!query);
  }
  if (searchInput) {
    searchInput.addEventListener('input', (e) => applyFilter(e.target.value));
  }
</script>
</body>
</html>
