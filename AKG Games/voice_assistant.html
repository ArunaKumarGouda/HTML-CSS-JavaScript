<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aruna – Virtual Assistant</title>
  <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
  <!-- Normalize default styles for consistency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-start: #0f172a; /* slate-900 */
      --bg-end: #1e293b;   /* slate-800 */
      --card-start: #22d3ee; /* cyan-400 */
      --card-end: #06b6d4;   /* cyan-500 */
      --accent-pink: #ec4899; /* pink-500 */
      --accent-blue: #0ea5e9;  /* sky-500 */
      --text-primary: #e2e8f0; /* slate-200 */
      --text-muted: #cbd5e1;   /* slate-300 */
      --ring: rgba(34,211,238,0.35);
      --shadow-1: rgba(0,0,0,0.25);
      --shadow-2: rgba(0,0,0,0.45);
      --surface: rgba(255,255,255,0.06);
      --surface-strong: rgba(255,255,255,0.12);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,0.15), transparent 40%),
                  radial-gradient(1000px 500px at 100% 0%, rgba(99,102,241,0.18), transparent 50%),
                  linear-gradient(135deg, var(--bg-start), var(--bg-end));
      background-size: 400% 400%;
      animation: bgAnimation 15s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--text-primary);
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Fullscreen background video (optional) */
    .bg-video { 
      position: fixed; 
      inset: 0; 
      z-index: -2; 
      overflow: hidden; 
    }
    .bg-video video { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      filter: saturate(1.1) brightness(0.6); 
    }
    .bg-overlay { 
      position: fixed; 
      inset: 0; 
      z-index: -1; 
      background: radial-gradient(1200px 600px at 10% -10%, rgba(34,211,238,0.12), transparent 40%), 
                  linear-gradient(135deg, rgba(15,23,42,0.4), rgba(30,41,59,0.6)); 
    }

    @keyframes bgAnimation {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    /* Back button */
    .back-button {
      position: fixed;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid var(--surface-strong);
      border-radius: 10px;
      cursor: pointer;
      background: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
      color: var(--text-primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 8px 20px var(--shadow-1);
      backdrop-filter: blur(6px);
      transition: transform 0.15s ease, box-shadow 0.25s ease, filter 0.2s ease;
      z-index: 100;
    }

    .back-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px var(--shadow-2);
      filter: brightness(1.1);
    }

    /* Main container */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      z-index: 1;
    }

    /* Logo */
    #logo {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.2);
      object-fit: cover;
      box-shadow: 0 20px 50px var(--shadow-2);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      background: var(--surface);
      padding: 8px;
    }

    #logo:hover {
      transform: scale(1.05);
      box-shadow: 0 25px 60px var(--shadow-2);
    }

    /* Title */
    h1 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.2;
      margin: 0;
    }

    #name {
      color: var(--accent-pink);
      display: inline-block;
      background: linear-gradient(135deg, var(--accent-pink), #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #va {
      color: var(--card-start);
      display: inline-block;
      background: linear-gradient(135deg, var(--card-start), var(--card-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Voice indicator */
    #voice {
      width: 160px;
      height: 160px;
      display: none;
      border-radius: 50%;
      box-shadow: 0 0 40px rgba(34,211,238,0.6), 
                  0 0 80px rgba(34,211,238,0.4);
      border: 3px solid rgba(34,211,238,0.5);
      animation: pulse 2s ease-in-out infinite;
      object-fit: cover;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 40px rgba(34,211,238,0.6), 
                    0 0 80px rgba(34,211,238,0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 60px rgba(34,211,238,0.8), 
                    0 0 120px rgba(34,211,238,0.6);
      }
    }

    /* Button */
    #btn {
      width: 100%;
      max-width: 400px;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: 18px;
      font-weight: 600;
      color: white;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.2s ease;
      box-shadow: 0 10px 30px var(--shadow-1);
      letter-spacing: 0.3px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }

    #btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }

    #btn:hover::before {
      left: 100%;
    }

    #btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px var(--shadow-2);
      filter: brightness(1.1);
    }

    #btn:active {
      transform: translateY(0);
    }

    #mic {
      width: 39px;
      height: 37px;
      filter: brightness(2) invert(1);
    }

    /* Content display */
    #content {
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Status card */
    .status-card {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      background: linear-gradient(145deg, var(--surface), var(--surface-strong));
      border: 1px solid var(--surface-strong);
      border-radius: 16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px var(--shadow-1);
      display: none;
      margin-top: 20px;
    }

    .status-card.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .status-card p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 480px) {
      #logo {
        width: 140px;
        height: 140px;
      }

      h1 {
        font-size: 28px;
      }

      #voice {
        width: 120px;
        height: 120px;
      }

      #btn {
        padding: 16px 20px;
        font-size: 16px;
      }

      .container {
        gap: 24px;
      }
    }

    /* Focus states for accessibility */
    #btn:focus-visible, .back-button:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--ring);
    }
  </style>



</head>
<body>
  <!-- Optional background video (uncomment if you want video background) -->
  <!--
  <div class="bg-video" aria-hidden="true">
    <video autoplay muted loop playsinline preload="auto">
      <source src="Asphalt 9_ Legends - Official Soft Launch Preview(720P_HD).mp4" type="video/mp4">
    </video>
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>
  -->

  <!-- Back button -->
  <a href="dashboard.html" class="back-button">
    <i class="fas fa-arrow-left"></i>
    <span>Back to Dashboard</span>
  </a>

  <!-- Main container -->
  <div class="container">
    <img src="logo.jpg" alt="Rajini Logo" id="logo">

    <h1>
      I'm <span id="name">Aruna</span>, Your<br>
      <span id="va">Virtual Assistant</span>
    </h1>

    <img src="image.png" alt="Listening" id="voice">

    <button id="btn">
      <img src="mic.png" alt="Microphone" id="mic">
      <span id="content">Click here to talk</span>
    </button>

    <div class="status-card" id="statusCard">
      <p id="statusText">Ready to listen...</p>
    </div>
  </div>

  <script>
    const btn = document.querySelector("#btn");
    const content = document.querySelector("#content");
    const voice = document.querySelector("#voice");
    const statusCard = document.querySelector("#statusCard");
    const statusText = document.querySelector("#statusText");

    /* =========================
       TEXT TO SPEECH
    ========================= */
    function speak(text) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-GB";
        speech.rate = 1;
        speech.pitch = 1;
        speech.volume = 1;
        window.speechSynthesis.speak(speech);
    }

    /* =========================
       WISH USER
    ========================= */
    function wishMe() {
        const hour = new Date().getHours();
        if (hour < 12) speak("Good morning sir");
        else if (hour < 16) speak("Good afternoon sir");
        else speak("Good evening sir");
    }

    window.addEventListener("load", wishMe);

    /* =========================
       SPEECH RECOGNITION
    ========================= */
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusCard.classList.add("active");
        statusText.textContent = "Speech recognition not supported in this browser.";
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.cursor = "not-allowed";
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = "en-US";
        recognition.interimResults = false;

        /* When speech is recognized */
        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            content.innerText = transcript;
            statusCard.classList.add("active");
            statusText.textContent = `You said: "${transcript}"`;
            processCommand(transcript);
        };

        recognition.onerror = (event) => {
            btn.style.display = "flex";
            voice.style.display = "none";
            statusCard.classList.add("active");
            statusText.textContent = "Error occurred. Please try again.";
            setTimeout(() => {
                statusCard.classList.remove("active");
            }, 3000);
        };

        recognition.onend = () => {
            btn.style.display = "flex";
            voice.style.display = "none";
        };

        /* =========================
           BUTTON CLICK
        ========================= */
        btn.addEventListener("click", () => {
            recognition.start();
            btn.style.display = "none";
            voice.style.display = "block";
            statusCard.classList.remove("active");
        });
    }

    /* =========================
       COMMAND PROCESSOR
    ========================= */
    function processCommand(message) {
        const command = message.toLowerCase().trim();

        if (command.startsWith("open google")) {
            speak("Opening Google");
            window.open("https://www.google.com", "_blank");
        }

        else if (command.startsWith("open youtube")) {
            speak("Opening YouTube");
            window.open("https://www.youtube.com", "_blank");
        }

        else if (command.startsWith("open facebook")) {
            speak("Opening Facebook");
            window.open("https://www.facebook.com", "_blank");
        }

        else if (command.startsWith("open instagram")) {
            speak("Opening Instagram");
            window.open("https://www.instagram.com", "_blank");
        }

        else if (command.includes("time")) {
            speak(`The time is ${new Date().toLocaleTimeString()}`);
        }

        else if (command.includes("date")) {
            speak(`Today's date is ${new Date().toLocaleDateString()}`);
        }

        else if (command.includes("who are you")) {
            speak("I am Aruna, your virtual assistant.");
        }

        else if (command.includes("hello") || command.includes("hey")) {
            speak("Hello sir, how can I help you?");
        }

        else {
            speak("Searching Google for you");
            window.open("https://www.google.com/search?q=${encodeURIComponent(command)}", "_blank");
        }

        setTimeout(() => {
            statusCard.classList.remove("active");
        }, 5000);
    }
  </script>

</body>
</html>
